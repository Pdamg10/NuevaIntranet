<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
<div class="main" id="main">
    <! - Carrusel de navegación->
    <div class="banner" id="banner">
        <! - Use la imagen como imagen de fondo, pero también como hipervínculo->
        <a href="">
            <div class="banner-slide slide1 slide-active"></div><! - Qué div es actual, agregue slide-active a cual->
        </a>
        <a href="">
            <div class="banner-slide slide2"></div>
        </a>
        <a href="">
            <div class="banner-slide slide3"></div>
        </a>
        <! - Sobrescribir después de escribir->
    </div>
    <! - Anterior, siguiente botón->
    <a href="javascript:void(0)" class="button prev" id="prev"></a><! - No hagas ningún salto de hipervínculo-><! - Estilo público: botón diferente: anterior->
    <a href="javascript:void(0)" class="button next" id="next"></a>
    <! - Navegación de puntos, haga clic para cambiar de imagen->
    <div class="dots" id="dots">
        <span class="active"></span><! - Actualmente activo->
        <span></span>
        <span></span>
    </div>
</div>

<script src="srcipt3.js"></script>
</body>
</html>
