<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CVG ALCASA - Control de Contingencia</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { --primary: #0d47a1; --secondary: #1565c0; --bg: #eceff1; --surface: #ffffff; --danger: #ff5252; --warning: #ffd740; --success: #69f0ae; }
        body { background: var(--bg); padding: 15px; font-family: 'Roboto', sans-serif; color: #37474f; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .header-container { background: var(--surface); padding: 15px 30px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between; }
        .logo-box { display: flex; align-items: center; gap: 20px; }
        .logo-box img { height: 65px; width: auto; }
        .title-box h5 { margin: 0; font-weight: 800; color: var(--primary); font-size: 1.3rem; text-transform: uppercase; }
        .main-card { background: var(--surface); padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .contingencia-container { background: #263238; border-radius: 12px; border: 4px solid #90a4ae; overflow: hidden; position: relative; }
        .map-wrapper { position: relative; width: 100%; height: 500px; background: white; overflow: hidden; }
        .planta-img-bg { width: 100%; height: 100%; object-fit: contain; display: block; }
        .updi-marker { position: absolute; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 0.7rem; box-shadow: 0 0 12px rgba(0,0,0,0.5); border: 2px solid white; z-index: 5; text-align: center; transform: translate(-50%, -50%); cursor: pointer; transition: 0.2s; }
        .updi-marker:hover { transform: translate(-50%, -50%) scale(1.1); }
        .updi-detail-card { margin-top: 20px; background: white; border-radius: 12px; border-left: 8px solid var(--primary); padding: 20px; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .detail-item { background: #f8f9fb; padding: 10px; border-radius: 8px; border: 1px solid #e3e8ee; }
        .industrial-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 25px; background: #eceff1; }
        .galpon-block { background: white; border: 2px solid #546e7a; border-radius: 4px; padding: 15px; position: relative; min-height: 160px; }
        .galpon-header { font-weight: 900; border-bottom: 2px solid #eee; margin-bottom: 10px; padding-bottom: 5px; color: var(--primary); font-size: 0.9rem; text-transform: uppercase; }
        .stats-box { font-size: 1.2rem; font-weight: 800; margin: 10px 0; }
        .roof-line { position: absolute; top: 0; left: 0; width: 100%; height: 6px; }
        .form-section { background: #f8f9fb; padding: 20px; border-radius: 12px; border: 1px solid #e3e8ee; margin-bottom: 25px; }
        .input-group { background: white; padding: 5px 15px; border-radius: 8px; border: 1px solid #d1d9e2; margin-bottom: 10px; }
        .input-group label { font-size: 0.7rem; color: var(--primary); font-weight: 700; text-transform: uppercase; }
        .smart-input { border: none !important; margin: 0 !important; font-weight: 600; height: 1.8rem !important; outline: none; width: 100%; }
        .smart-area { border: none !important; margin: 0 !important; font-weight: 500; min-height: 40px; outline: none; width: 100%; resize: none; padding-top: 5px; }
        .records-container { border: 1px solid #e0e6ed; border-radius: 12px; overflow: hidden; background: white; }
        .table-scroll { max-height: 450px; overflow-y: auto; }
        thead th { position: sticky; top: 0; background: #fff !important; z-index: 10; border-bottom: 2px solid #e0e6ed !important; }
        .led { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle; }
        .bg-rojo { background-color: var(--danger); box-shadow: 0 0 8px var(--danger); }
        .bg-amarillo { background-color: var(--warning); box-shadow: 0 0 8px var(--warning); }
        .bg-verde { background-color: var(--success); box-shadow: 0 0 8px var(--success); }
        .btn-main { background: var(--primary); color: white; border-radius: 8px; padding: 10px 20px; border: none; cursor: pointer; font-weight: 700; width: 100%; height: 45px; }
        .btn-main.disabled { background: #b0bec5 !important; cursor: not-allowed; }
        .action-btn { cursor: pointer; margin: 0 5px; }
        .kpi-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e0e6ed; height: 100%; }
        .semaforo-global { width: 45px; height: 45px; border-radius: 50%; margin: 0 auto 10px; border: 2px solid #eee; }
        .filter-panel-dash { background: #f1f4f9; padding: 15px; border-radius: 12px; margin: 20px 0; border: 1px solid #e0e6ed; }
        .justificacion-text { background: #f5f7f9; padding: 8px; border-radius: 5px; font-size: 0.8rem; margin-top: 10px; border-left: 3px solid var(--primary); color: #455a64; font-style: italic; }
        .tabs .tab a { color: var(--primary) !important; font-weight: 700; }
        .tabs .indicator { background-color: var(--primary) !important; }
        .header-filter { height: 30px !important; display: block !important; border: 1px solid #ddd; border-radius: 4px; font-size: 0.8rem; }
        .oee-container { display: none; background: #e3f2fd; padding: 15px; border-radius: 10px; border: 1px dashed #1565c0; margin-bottom: 15px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <div class="center">
            <img src="http://alcasa.com.ve/sitio/Imagenes/Logo-CVG-Alcasa1.gif" style="height:80px;">
            <h5 style="font-weight:800; color:var(--primary); margin-top:20px;">ACCESO RESTRINGIDO</h5>
        </div>
        <div class="input-field">
            <i class="material-icons prefix">person</i>
            <input type="text" id="user-login">
            <label for="user-login">Usuario</label>
        </div>
        <div class="input-field">
            <i class="material-icons prefix">lock</i>
            <input type="password" id="pass-login">
            <label for="pass-login">Contraseña</label>
        </div>
        <button class="btn-main" onclick="validarAcceso()">ENTRAR AL SISTEMA</button>
    </div>
</div>

<div id="main-content" style="display:none;">
    <div class="header-container">
        <div class="logo-box">
            <img src="http://alcasa.com.ve/sitio/Imagenes/Logo-CVG-Alcasa1.gif" alt="Logo">
            <div class="title-box">
                <h5>SISTEMA DE CONTROL DE CONTINGENCIA Y GESTION DE OPERATIVIDAD (OEE)</h5>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span id="display-user-name" class="grey-text text-darken-2" style="font-weight: 800; font-size: 0.8rem; border-right: 2px solid #ddd; padding-right: 10px; text-transform: uppercase;">USUARIO</span>
                    <span id="sync-status" class="blue-text" style="font-size: 0.7rem; font-weight: bold;">ESPERANDO VINCULACIÓN...</span>
                </div>
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-flat red-text text-darken-4" onclick="generarPDF()" style="font-weight: 700; border: 1px solid #d32f2f; border-radius: 8px;">
                <i class="material-icons left">picture_as_pdf</i> INFORME PDF
            </button>
            <button class="btn-flat blue-text text-darken-4" onclick="vincularArchivo()" style="font-weight: 700; border: 1px solid #0d47a1; border-radius: 8px;">
                <i class="material-icons left">cloud_upload</i> VINCULAR EXCEL
            </button>
        </div>
    </div>

    <div class="main-card">
        <div id="ui" style="display:none;">
            <ul class="tabs transparent">
                <li class="tab col s4"><a class="active" href="#edicion">GESTIÓN DE DATOS</a></li>
                <li class="tab col s4"><a href="#dashboard" onclick="renderDashboard()">TABLERO DE MANDO</a></li>
                <li class="tab col s4"><a href="#integral" onclick="renderIntegral()">TABLERO DE CONTINGENCIA</a></li>
            </ul>

            <div id="edicion" class="col s12">
                <div class="form-section" style="margin-top:20px;">
                    <input type="hidden" id="edit-index" value="-1">
                    <div class="row" style="margin-bottom:0;">
                        <div class="col s12 m3"><div class="input-group"><label>Gerencia</label><input type="text" id="f-gerencia" list="list-gerencia" class="smart-input"></div></div>
                        <div class="col s12 m3"><div class="input-group"><label>Área</label><input type="text" id="f-area" list="list-area" class="smart-input"></div></div>
                        <div class="col s12 m3"><div class="input-group"><label>Alcance</label><input type="text" id="f-alcance" list="list-alcance" class="smart-input"></div></div>
                        <div class="col s12 m3"><div class="input-group"><label>UPDI #</label><input type="text" id="f-updi" list="list-updi" class="smart-input"></div></div>
                    </div>
                    <div class="row" style="margin-top:10px;">
                        <div class="col s12 m2"><div class="input-group"><label>F.L. Total</label><input type="number" id="f-fuerza" class="smart-input"></div></div>
                        <div class="col s12 m2"><div class="input-group"><label>% Real <i class="material-icons tiny blue-text" style="cursor:pointer" onclick="toggleOEE()">settings_suggest</i></label><input type="number" id="f-real" class="smart-input"></div></div>
                        <div class="col s12 m2"><div class="input-group"><label>% Plan Meta</label><input type="number" id="f-plan" class="smart-input"></div></div>
                        <div class="col s12 m6"><div class="input-group"><label>Justificación</label><textarea id="f-justificacion" class="smart-area"></textarea></div></div>
                    </div>
                    <div id="oee-panel" class="oee-container">
                        <div class="row" style="margin-bottom:0;">
                            <div class="col s12 m3"><div class="input-group"><label>T. OPERACIÓN REAL</label><input type="number" id="f-t-real" class="smart-input" oninput="calcularOEE()"></div></div>
                            <div class="col s12 m3"><div class="input-group"><label>TIEMPO PLANIFICADO</label><input type="number" id="f-t-plan" class="smart-input" oninput="calcularOEE()"></div></div>
                            <div class="col s12 m3"><div class="input-group"><label>DISPONIBILIDAD (%)</label><input type="number" id="f-oee-disp" class="smart-input" style="background:#f1f8e9!important" readonly></div></div>
                            <div class="col s12 m3"><div class="input-group"><label>UNID. PRODUCIDAS</label><input type="number" id="f-u-prod" class="smart-input" oninput="calcularOEE()"></div></div>
                        </div>
                        <div class="row" style="margin-bottom:0;">
                            <div class="col s12 m3"><div class="input-group"><label>UNID. TEÓRICAS MÁX.</label><input type="number" id="f-u-teor" class="smart-input" oninput="calcularOEE()"></div></div>
                            <div class="col s12 m3"><div class="input-group"><label>RENDIMIENTO (%)</label><input type="number" id="f-rend" class="smart-input" style="background:#f1f8e9!important" readonly></div></div>
                            <div class="col s12 m3"><div class="input-group"><label>UNIDADES BUENAS</label><input type="number" id="f-u-buenas" class="smart-input" oninput="calcularOEE()"></div></div>
                            <div class="col s12 m3"><div class="input-group"><label>UNID. PROD. TOTAL</label><input type="number" id="f-u-total" class="smart-input" oninput="calcularOEE()"></div></div>
                        </div>
                        <div class="row" style="margin-bottom:0;">
                            <div class="col s12 m6"><div class="input-group"><label>CALIDAD (%)</label><input type="number" id="f-calidad" class="smart-input" style="background:#f1f8e9!important" readonly></div></div>
                            <div class="col s12 m6"><div class="input-group"><label>OPERATIVIDAD OEE (%)</label><input type="number" id="f-oee-final" class="smart-input" style="background:#f1f8e9!important; color:red!important; font-weight:bold" readonly></div></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col s12 m6 offset-m3"><button id="btn-save" class="btn-main" onclick="procesarFormulario()">ACTUALIZAR Y GUARDAR EN EXCEL</button></div>
                        <div class="col s12 m3"><button class="btn-flat grey lighten-3" onclick="cancelarEdicion()" style="width:100%; border-radius:8px; height:45px;">LIMPIAR</button></div>
                    </div>
                </div>
                <div class="records-container">
                    <div class="table-scroll"><table class="centered highlight"><thead id="h-table-edicion"></thead><tbody id="b-table-edicion"></tbody></table></div>
                </div>
            </div>

            <div id="dashboard" class="col s12">
                <div class="filter-panel-dash"><div class="row" id="dash-filters-container" style="margin-bottom:0;"></div></div>
                <div id="kpi-dashboard" class="row"></div>
                <div class="row" id="grid-cards"></div>
            </div>

            <div id="integral" class="col s12" style="margin-top:20px;">
                <div class="contingencia-container">
                    <div class="map-wrapper" id="updi-map-area">
                        <img src="http://alcasa.com.ve/sitio/empresa/plan/VI Linea.jpg" class="planta-img-bg" alt="Planta">
                    </div>
                    <div id="updi-info-panel" class="updi-detail-card"></div>
                    <div class="industrial-grid" id="industrial-map"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<datalist id="list-gerencia"></datalist><datalist id="list-area"></datalist><datalist id="list-alcance"></datalist><datalist id="list-updi"></datalist>

<script>
    // --- LÓGICA DE NEGOCIO ---
    function calcularOEE() {
        const getValue = (id) => parseFloat(document.getElementById(id).value) || 0;
        const tReal = getValue('f-t-real'), tPlan = getValue('f-t-plan'), uProd = getValue('f-u-prod'), uTeor = getValue('f-u-teor'), uBuenas = getValue('f-u-buenas'), uTotal = getValue('f-u-total');
        const disp = tPlan > 0 ? (tReal / tPlan) : 0, rend = uTeor > 0 ? (uProd / uTeor) : 0, calidad = uTotal > 0 ? (uBuenas / uTotal) : 0;
        let factores = []; if (disp > 0) factores.push(disp); if (rend > 0) factores.push(rend); if (calidad > 0) factores.push(calidad);
        const oee = factores.length > 0 ? factores.reduce((a, b) => a * b) : 0;
        document.getElementById('f-oee-disp').value = (disp * 100).toFixed(2);
        document.getElementById('f-rend').value = (rend * 100).toFixed(2);
        document.getElementById('f-calidad').value = (calidad * 100).toFixed(2);
        document.getElementById('f-oee-final').value = (oee * 100).toFixed(2);
        if(oee > 0) document.getElementById('f-real').value = (oee * 100).toFixed(2);
    }
    function toggleOEE() { const p = document.getElementById('oee-panel'); p.style.display = (p.style.display === 'none') ? 'block' : 'none'; }

    const USUARIOS_AUTORIZADOS = [
        { user: "admin", pass: "1234", nivel: "admin", nombreLargo: "ADMINISTRADOR DEL SISTEMA" },
        { user: "alcasa", pass: "2026", nivel: "visor", nombreLargo: "USUARIO DE PRUEBA" },
        { user: "sm25946", pass: "aa122525", nivel: "admin", nombreLargo: "SEBASTIAN MARCANO" },
        { user: "mv12810", pass: "mauro52", nivel: "admin", nombreLargo: "MAURO VITALI" },
        { user: "am26678", pass: "0123456789", nivel: "admin", nombreLargo: "Alexander A. Matson Ruiz" },
        { user: "gc26665", pass: "familiacaldera", nivel: "admin", nombreLargo: "GUSTAVO CALDERA" }
    ];

    // --- GLOSARIO DE DESCRIPCIONES DE UPDI ---
    const DESCRIPCIONES_UPDI = {
        "1": "Portón Principal. Entrada y Salida de materiales, materias primas y control de acceso de personal.",
        "2": "Edificios Administrativos 1 y 2. Gerencias Administrativas.",
        "3": "Estación de servicio. Estación de Servicio de combustible. Almacén Central. Transporte de Personal.",
        "4": "Planta Laminación. Laminación en Caliente. Laminación Frío. Empaque.",
        "5": "S/E Eléctricas y Plantas de Agua. Subestaciones Eléctricas. Planta de Agua Industrial.",
        "6": "Planta Extrusión. Planta de Extrusión.",
        "7": "Estación de Gas Natural y Portón Av FFAA. Estación de distribución de gas. Portón de salida conducente a la Av Fzas Armadas diagonal a Planta Carbón.",
        "8": "Taller Central. Taller máquinas. Taller Soldadura. Taller Nuevo.",
        "9": "Taller Automotriz y Punto 5. Taller automotriz. Almacén de estructuras punto 5.",
        "10": "Laboratorio Químico.",
        "11": "Edificio Ingeniería. Edificio Ingeniería (gerencias técnicas). Sala de Cultura.",
        "12": "Portón Laboratorio. Portón de salida alterno laboratorio. Celdas III.",
        "13": "Planta Fundición. Planta Fundición. Patio de almacenamiento de productos terminados.",
        "14": "Cocina Central. Cocina Central. Comedores.",
        "15": "Servicios Médicos y Control de Emergencias. Sala de Enfermería. Control de Emergencias. Servicio de Ambulancias.",
        "16": "Sala de Servidores y Telecomunicaciones. Sala de Servidores. Red y Servicio de Telecomunicaciones.",
        "17": "Punto 6. Límite con CVG CARBONORCA.",
        "18": "Sala de Compresores y Servicios Reducción. Sala de compresores. Sistema de Grúas Celdas II. Recuperación de Cátodos."
    };

    let nivelUsuarioActivo = "";
    let archivoCSVHandle = null; 

    function validarAcceso() {
        const u = document.getElementById('user-login').value, p = document.getElementById('pass-login').value;
        const check = USUARIOS_AUTORIZADOS.find(usr => usr.user === u && usr.pass === p);
        if(check) {
            nivelUsuarioActivo = check.nivel;
            document.getElementById('display-user-name').innerText = check.nombreLargo;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            M.Tabs.init(document.querySelectorAll('.tabs'));
            if(nivelUsuarioActivo === "visor") {
                const btnSave = document.getElementById('btn-save'); btnSave.classList.add('disabled'); btnSave.innerText = "ACCESO DE SOLO LECTURA";
                document.querySelectorAll('.smart-input, .smart-area').forEach(i => i.disabled = true);
            }
            M.toast({html: `Bienvenido: ${check.nombreLargo}`, classes: 'blue rounded'});
        } else { M.toast({html: 'Usuario o Clave Incorrecta', classes: 'red rounded'}); }
    }

    let handle, excelData = [], idx = {}, filtersEdicion = { ger: '', are: '', alc: '' }, modoEdicionActivo = false;
    const updiCoords = { 
        "1": { top: "60%", left: "49%" }, "2": { top: "37%", left: "47%" }, "3": { top: "30%", left: "49%" }, 
        "4": { top: "47%", left: "49%" }, "5": { top: "43%", left: "62%" }, "6": { top: "43%", left: "52%" }, 
        "7": { top: "32%", left: "52%" }, "8": { top: "60%", left: "39%" }, "9": { top: "53%", left: "52%" },
        "10": { top: "25%", left: "40%" }, "11": { top: "20%", left: "45%" }, "12": { top: "15%", left: "50%" },
        "13": { top: "70%", left: "60%" }, "14": { top: "75%", left: "55%" }, "15": { top: "80%", left: "45%" },
        "16": { top: "60%", left: "46%" }, "17": { top: "85%", left: "70%" }, "18": { top: "50%", left: "70%" }
    };

async function consultarIntegrantesCSV(numeroUPDI) {
        const listaContenedor = document.getElementById(`lista-integrantes-${numeroUPDI}`);
        if (listaContenedor && listaContenedor.style.display === 'block') {
            listaContenedor.style.display = 'none';
            return;
        }

        try {
            if (!archivoCSVHandle) {
                M.toast({html: 'Seleccione el archivo UPDIS.CSV', classes: 'blue'});
                [archivoCSVHandle] = await window.showOpenFilePicker({
                    types: [{ description: 'CSV de Integrantes', accept: {'text/csv': ['.csv']} }],
                    multiple: false
                });
            }

            const file = await archivoCSVHandle.getFile();
            const buffer = await file.arrayBuffer();
            
            let contenido = "";
            const decoderUTF8 = new TextDecoder('utf-8', { fatal: true });
            const decoderWin = new TextDecoder('windows-1252', { fatal: false });

            try {
                contenido = decoderUTF8.decode(buffer);
            } catch (e) {
                contenido = decoderWin.decode(buffer);
            }
            
            const lineas = contenido.split(/\r?\n/);
            const filas = lineas.slice(1);
            const updiBuscada = `UPDI ${numeroUPDI}`.trim().toUpperCase();
            
            let htmlIntegrantes = `
                <div style="background: #e3f2fd; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid #bbdefb; animation: fadeIn 0.3s; overflow-x: auto;">
                    <h6 style="font-size: 0.8rem; font-weight: 800; color: #0d47a1; margin: 0 0 8px 0; border-bottom: 1px solid #90caf9;">TRABAJADORES ASIGNADOS (EDICIÓN HABILITADA):</h6>
                    <table id="tabla-edit-csv-${numeroUPDI}" style="font-size: 0.75rem; width: 100%;">
                        <thead>
                            <tr style="color: #1565c0;">
                                <th>FICHA</th>
                                <th>NOMBRE Y APELLIDO</th>
                                <th>TELÉFONO</th>
                                <th>ROL CTD</th>
                                <th>CARGO</th>
                                <th>STATUS</th>
                            </tr>
                        </thead>
                        <tbody>`;

            let hayDatos = false;
            filas.forEach((f, idx) => {
                const c = f.split(';');
                if (c[0] && c[0].trim().toUpperCase() === updiBuscada) {
                    hayDatos = true;
                    const currentStatus = (c[6] || "").trim().toUpperCase();
                    
                    htmlIntegrantes += `
                        <tr data-original-index="${idx + 1}" style="border-bottom: 1px solid #e0e0e0;">
                            <td contenteditable="true">${c[1] || ''}</td>
                            <td contenteditable="true"><b>${c[2] || ''}</b></td>
                            <td contenteditable="true">${c[3] || ''}</td>
                            <td contenteditable="true">${c[4] || ''}</td>
                            <td contenteditable="true">${c[5] || ''}</td>
                            <td>
                                <select class="browser-default" style="height: 25px; font-size: 0.7rem; padding: 0;">
                                    <option value="ACTIVO" ${currentStatus === 'ACTIVO' ? 'selected' : ''}>ACTIVO</option>

    async function guardarCambiosCSV(numeroUPDI) {
        try {
            const file = await archivoCSVHandle.getFile();
            const textoOriginal = await file.text();
            let lineas = textoOriginal.split(/\r?\n/);
            const tabla = document.getElementById(`tabla-edit-csv-${numeroUPDI}`);
            const filasEditadas = tabla.querySelectorAll('tbody tr');
            const updiEtiqueta = `UPDI ${numeroUPDI}`;

            filasEditadas.forEach(tr => {
                const idxOriginal = tr.getAttribute('data-original-index');
                const c = tr.querySelectorAll('td');
                const statusSelect = tr.querySelector('select').value;
                
                // Reconstruimos la línea: UPDI#;FICHA;NOMBRE;TEL;ROL;CARGO;STATUS
                lineas[idxOriginal] = `${updiEtiqueta};${c[0].innerText.trim()};${c[1].innerText.trim()};${c[2].innerText.trim()};${c[3].innerText.trim()};${c[4].innerText.trim()};${statusSelect}`;
            });

            const nuevoContenido = lineas.join('\n');
            const writable = await archivoCSVHandle.createWritable();
            await writable.write(nuevoContenido);
            await writable.close();

            M.toast({html: '✅ ARCHIVO CSV ACTUALIZADO CON STATUS', classes: 'green'});
        } catch (error) {
            console.error(error);
            M.toast({html: '❌ ERROR AL GUARDAR EL CSV', classes: 'red'});
        }
    }

            doc.text(`Responsable: ${usuario}`, 10, 22);
            doc.text(`Archivo de origen: ${handle.name} | Fecha: ${new Date().toLocaleString()}`, 10, 27);
            let sFLT=0, sFLR=0, sFLP=0, criticas=0;
            excelData.slice(1).forEach(r => {
                const ft = parseFloat(r[idx.fuerza])||0, real=parseFloat(r[idx.real])||0, plan=parseFloat(r[idx.plan])||0;
                sFLT += ft; sFLR += Math.round((real/100)*ft); sFLP += Math.round((plan/100)*ft);
                if(plan > 0 && (real/plan) < 0.5) criticas++;
            });
            doc.setFont("helvetica", "bold"); doc.text("1. RESUMEN EJECUTIVO", 10, 35);
            doc.setFont("helvetica", "normal");
            doc.text(`Fuerza Laboral Total: ${sFLT} | Real: ${sFLR} | Meta Plan: ${sFLP}`, 10, 40);
            doc.text(`Áreas en Estado Crítico: ${criticas} | Disponibilidad Global: ${(sFLP > 0 ? (sFLR/sFLP)*100 : 0).toFixed(1)}%`, 10, 45);
            doc.setFont("helvetica", "bold"); doc.text("2. DETALLE TÉCNICO POR ÁREA", 10, 55);
            doc.setDrawColor(200); doc.line(10, 58, 200, 58);
            let y = 65; doc.setFontSize(7);
            doc.text("GERENCIA", 10, y); doc.text("ÁREA", 50, y); doc.text("FLT", 100, y); doc.text("REAL%", 120, y); doc.text("PLAN%", 140, y); doc.text("DISP%", 160, y);
            y += 5;
            excelData.slice(1).forEach(row => {
                if(y > 275) { doc.addPage(); y = 20; }
                doc.setFont("helvetica", "normal");
                doc.text(String(row[idx.gerencia]||"").substring(0,25), 10, y);
                doc.text(String(row[idx.area]||"").substring(0,30), 50, y);
                doc.text(String(row[idx.fuerza]||"0"), 100, y);
                doc.text(String(row[idx.real]||"0")+"%", 120, y);
                doc.text(String(row[idx.plan]||"0")+"%", 140, y);
                const d = (parseFloat(row[idx.plan]) > 0 ? (parseFloat(row[idx.real])/parseFloat(row[idx.plan])*100).toFixed(0) : "0") + "%";
                doc.text(d, 160, y);
                y += 6; 
            });
            doc.save(`Analisis_Tecnico_ALCASA_${new Date().getTime()}.pdf`);
        } else if (activeTab === '#dashboard') {
            const doc = new jsPDF('l', 'mm', 'a4'); 
            doc.setFontSize(16); doc.setFont("helvetica", "bold"); doc.setTextColor(0);
            doc.text("CVG ALCASA - INFORME VISUAL DE CONTINGENCIA", 15, 15);
            doc.setFontSize(10); doc.text(`Responsable: ${usuario} | Fuente: ${handle.name} | Fecha: ${new Date().toLocaleString()}`, 15, 22);
            const toast = M.toast({html: 'Generando Informe Nítido...', displayLength: 0});
            try {
                const kpi = await html2canvas(document.getElementById('kpi-dashboard'), { scale: 2 });
                const cards = await html2canvas(document.getElementById('grid-cards'), { scale: 2 });
                doc.addImage(kpi.toDataURL('image/jpeg', 1.0), 'JPEG', 15, 30, 265, 35);
                doc.text("Tablero de Mando por Gerencia/Área", 15, 75);
                const cardsH = (cards.height * 265) / cards.width;
                doc.addImage(cards.toDataURL('image/jpeg', 1.0), 'JPEG', 15, 80, 265, cardsH > 120 ? 120 : cardsH);
                doc.save(`Informe_Visual_ALCASA_${new Date().getTime()}.pdf`);
                toast.dismiss();
            } catch(e) { toast.dismiss(); }
        } else {
            const doc = new jsPDF('l', 'mm', 'a4'); 
            doc.setFontSize(16); doc.setFont("helvetica", "bold");
            doc.text("CVG ALCASA - TABLERO INTEGRAL DE CONTINGENCIA", 15, 15);
            doc.setFontSize(10); doc.text(`Responsable: ${usuario} | Fecha: ${new Date().toLocaleString()}`, 15, 22);
            const toast = M.toast({html: 'Generando Mapa de Alta Resolución...', displayLength: 0});
            try {
                const mapa = await html2canvas(document.getElementById('updi-map-area'), { scale: 2 });
                const industrial = await html2canvas(document.getElementById('industrial-map'), { scale: 2 });
                doc.text("Localización de Contingencia (UPDIs)", 15, 30);
                doc.addImage(mapa.toDataURL('image/jpeg', 1.0), 'JPEG', 15, 35, 265, 90);
                doc.text("Estado de Áreas Industriales", 15, 135);
                const indH = (industrial.height * 265) / industrial.width;
                doc.addImage(industrial.toDataURL('image/jpeg', 1.0), 'JPEG', 15, 140, 265, indH > 60 ? 60 : indH);
                doc.save(`Tablero_Contingencia_ALCASA_${new Date().getTime()}.pdf`);
                toast.dismiss();
            } catch(e) { toast.dismiss(); }
        }
    }
    window.onload = () => { M.AutoInit(); };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
