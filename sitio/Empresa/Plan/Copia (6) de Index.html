<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA ALCASA - CONTROL DE CONTINGENCIA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { --primary: #0d47a1; --accent: #1565c0; --danger: #ff5252; --success: #69f0ae; }
        body { background: #eceff1; font-family: 'Roboto', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* ENCABEZADO INSTITUCIONAL ACTUALIZADO */
        .main-header {
            background: white;
            padding: 10px 30px;
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Alineado a la izquierda */
            gap: 20px; /* Espacio entre logo y título */
            border-bottom: 3px solid var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header-title {
            color: var(--primary);
            font-weight: 900;
            font-size: 1.8rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .header-logo img {
            height: 60px;
            width: auto;
            display: block;
        }

        /* TABS Y CONTENEDORES */
        .tabs { background: transparent; margin-top: 10px; }
        .tabs .tab a { color: #555; font-weight: bold; }
        .tabs .tab a.active { color: var(--primary) !important; }
        .tabs .indicator { background-color: var(--primary) !important; }

        .form-horizontal { 
            background: white; padding: 15px; border-radius: 8px; 
            border: 1px solid #ddd; margin: 15px;
        }

        /* TABLA Y FILTROS */
        .table-card { 
            background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            margin: 0 15px 15px 15px; display: flex; flex-direction: column; border: 1px solid #cfd8dc;
            height: calc(100vh - 360px); min-height: 400px;
        }
        .table-scroll { flex-grow: 1; overflow: auto; width: 100%; }
        table { border-collapse: collapse; width: 100%; }
        thead th { 
            position: sticky; top: 0; z-index: 10;
            background: #f1f4f9 !important; color: var(--primary);
            font-size: 0.75rem; text-transform: uppercase; padding: 12px 5px !important;
            border-bottom: 2px solid #d1d9e2;
        }
        .filter-bar {
            background: #f8f9fa; padding: 10px 15px; border-bottom: 1px solid #e0e0e0;
            display: flex; gap: 20px; align-items: center;
        }
        .filter-item { flex: 1; }
        .filter-item label { font-weight: bold; font-size: 0.7rem; color: var(--primary); }
        .filter-item select { border: 1px solid #bbb !important; height: 2.2rem !important; display: block; border-radius: 4px; }

        /* CAMPOS FORMULARIO */
        .input-group { background: #f5f7f9; padding: 5px 8px; border-radius: 4px; border: 1px solid #d1d9e2; min-height: 52px; }
        .input-group label { font-size: 0.65rem; color: var(--primary); font-weight: bold; }
        .smart-input, .input-group select { border: none !important; height: 1.6rem !important; width: 100%; background: transparent !important; display: block; font-size: 0.85rem; }
        
        .led { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .bg-rojo { background: var(--danger); }
        .bg-amarillo { background: #ffd740; }
        .bg-verde { background: var(--success); }
    </style>
</head>
<body>

<header class="main-header">
    <div class="header-logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Logo_Alcasa.svg/1200px-Logo_Alcasa.svg.png" alt="Logo CVG ALCASA">
    </div>
    <h1 class="header-title">Sistema de Control de Contingencia</h1>
</header>

<div class="row" style="margin-bottom: 0;">
    <div class="col s12">
        <ul class="tabs">
            <li class="tab col s6"><a class="active" href="#tab-gestion">GESTIÓN DE DATOS</a></li>
            <li class="tab col s6"><a href="#tab-mapa">TABLERO / MAPA</a></li>
        </ul>
    </div>

    <div id="tab-gestion" class="col s12">
        <div class="form-horizontal z-depth-1">
            <input type="hidden" id="edit-idx" value="-1">
            <div class="row" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;">
                <div style="flex: 1.2; min-width: 140px;"><div class="input-group"><label>Gerencia</label><select id="f-ger" class="browser-default"></select></div></div>
                <div style="flex: 1.2; min-width: 140px;"><div class="input-group"><label>Área</label><select id="f-are" class="browser-default"></select></div></div>
                <div style="flex: 1.2; min-width: 140px;"><div class="input-group"><label>Alcance</label><select id="f-alc" class="browser-default"></select></div></div>
                <div style="flex: 0.4; min-width: 70px;"><div class="input-group"><label>UPDI #</label><select id="f-upd" class="browser-default"></select></div></div>
                <div style="flex: 0.4; min-width: 70px;"><div class="input-group"><label>F.L.T.</label><input type="number" id="f-fue" class="smart-input"></div></div>
                <div style="flex: 0.4; min-width: 70px;"><div class="input-group"><label>% Real</label><input type="number" id="f-rea" class="smart-input"></div></div>
                <div style="flex: 0.4; min-width: 70px;"><div class="input-group"><label>% Plan</label><input type="number" id="f-pla" class="smart-input"></div></div>
                <div style="flex: 1.5; min-width: 180px;"><div class="input-group"><label>Justificación</label><input type="text" id="f-jus" class="smart-input"></div></div>
                <div style="display: flex; align-items: center; gap: 5px;">
                    <button class="btn blue darken-4" onclick="guardarCambios()" title="Guardar"><i class="material-icons">save</i></button>
                    <button class="btn-flat grey lighten-3" onclick="limpiarForm()" title="Limpiar"><i class="material-icons">refresh</i></button>
                </div>
            </div>
            <div class="center">
                <input type="file" id="file-in" style="display:none" onchange="cargarArchivo(this)">
                <button class="btn-small green darken-2" onclick="document.getElementById('file-in').click()"><i class="material-icons left">file_upload</i>CARGAR EXCEL</button>
                <button class="btn-small orange darken-3" onclick="descargarExcel()"><i class="material-icons left">file_download</i>DESCARGAR</button>
            </div>
        </div>

        <div class="table-card">
            <div class="filter-bar">
                <div class="filter-item">
                    <label>Filtrar Gerencia</label>
                    <select id="filter-ger" class="browser-default" onchange="filtrar()"></select>
                </div>
                <div class="filter-item">
                    <label>Filtrar Área</label>
                    <select id="filter-are" class="browser-default" onchange="filtrar()"></select>
                </div>
                <div class="filter-item">
                    <label>Filtrar Alcance</label>
                    <select id="filter-alc" class="browser-default" onchange="filtrar()"></select>
                </div>
            </div>
            <div class="table-scroll">
                <table class="centered highlight">
                    <thead id="t-head"></thead>
                    <tbody id="t-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="tab-mapa" class="col s12">
        <div class="card-panel center" style="margin-top: 20px;">
            <h5>Visualización de Mapa</h5>
            <p>Siguiente fase: Integración de puntos geográficos.</p>
        </div>
    </div>
</div>

<script>
    let excelData = [], idx = {};

    function cargarArchivo(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const wb = XLSX.read(e.target.result, {type: 'array'});
            excelData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
            mapearColumnas();
            poblarTodosLosDesplegables();
            renderizar();
            M.toast({html: 'Archivo cargado con éxito'});
        };
        reader.readAsArrayBuffer(input.files[0]);
    }

    function mapearColumnas() {
        const h = excelData[0].map(v => String(v).toUpperCase().trim());
        idx = {
            ger: h.indexOf("GERENCIA"), are: h.indexOf("AREA"),
            alc: h.findIndex(v => v.includes("ALCANCE")), upd: h.findIndex(v => v.includes("UPDI")),
            fue: h.findIndex(v => v.includes("FUERZA")), rea: h.indexOf("REAL"),
            pla: h.indexOf("PLAN"), dis: h.findIndex(v => v.includes("DISP")),
            jus: h.indexOf("JUSTIFICACION")
        };
    }

    function poblarTodosLosDesplegables() {
        const poblar = (colIdx, elementIds) => {
            if (colIdx === -1) return;
            const valores = [...new Set(excelData.slice(1).map(r => r[colIdx]).filter(v => v))].sort();
            
            elementIds.forEach(id => {
                const el = document.getElementById(id);
                let opciones = id.includes('filter') ? `<option value="">--- TODOS ---</option>` : `<option value="" disabled selected>Elegir...</option>`;
                opciones += valores.map(v => `<option value="${v}">${v}</option>`).join('');
                el.innerHTML = opciones;
            });
        };
        poblar(idx.ger, ['f-ger', 'filter-ger']);
        poblar(idx.are, ['f-are', 'filter-are']);
        poblar(idx.alc, ['f-alc', 'filter-alc']);
        poblar(idx.upd, ['f-upd']);
    }

    function renderizar() {
        const head = document.getElementById('t-head'), body = document.getElementById('t-body');
        if (!excelData.length) return;
        
        head.innerHTML = `<tr>${excelData[0].map(c => `<th>${c}</th>`).join('')}<th>ACCIONES</th></tr>`;
        
        let rows = "";
        excelData.slice(1).forEach((row, i) => {
            if(!row[idx.ger]) return;
            const r = parseFloat(row[idx.rea]) || 0, p = parseFloat(row[idx.pla]) || 1, d = r / p;
            const color = d < 0.5 ? 'rojo' : d < 0.8 ? 'amarillo' : 'verde';
            let celdas = "";
            for(let j=0; j < excelData[0].length; j++) {
                if(j === idx.dis) celdas += `<td><span class="led bg-${color}"></span>${(d*100).toFixed(0)}%</td>`;
                else celdas += `<td>${row[j] || ''}</td>`;
            }
            rows += `<tr>${celdas}<td>
                <i class="material-icons blue-text" style="cursor:pointer" onclick="editar(${i+1})">edit</i>
                <i class="material-icons red-text" style="cursor:pointer; margin-left:5px;" onclick="eliminar(${i+1})">delete</i>
            </td></tr>`;
        });
        body.innerHTML = rows;
        filtrar();
    }

    function filtrar() {
        const fGer = document.getElementById('filter-ger').value.toUpperCase();
        const fAre = document.getElementById('filter-are').value.toUpperCase();
        const fAlc = document.getElementById('filter-alc').value.toUpperCase();
        const filas = document.querySelectorAll("#t-body tr");

        filas.forEach(fila => {
            const txtGer = fila.children[idx.ger]?.innerText.toUpperCase() || "";
            const txtAre = fila.children[idx.are]?.innerText.toUpperCase() || "";
            const txtAlc = fila.children[idx.alc]?.innerText.toUpperCase() || "";
            
            const cumpleGer = !fGer || txtGer === fGer;
            const cumpleAre = !fAre || txtAre === fAre;
            const cumpleAlc = !fAlc || txtAlc === fAlc;

            fila.style.display = (cumpleGer && cumpleAre && cumpleAlc) ? "" : "none";
        });
    }

    function editar(i) {
        const r = excelData[i];
        document.getElementById('edit-idx').value = i;
        document.getElementById('f-ger').value = r[idx.ger] || "";
        document.getElementById('f-are').value = r[idx.are] || "";
        document.getElementById('f-alc').value = r[idx.alc] || "";
        document.getElementById('f-upd').value = r[idx.upd] || "";
        document.getElementById('f-fue').value = r[idx.fue] || "";
        document.getElementById('f-rea').value = r[idx.rea] || "";
        document.getElementById('f-pla').value = r[idx.pla] || "";
        document.getElementById('f-jus').value = r[idx.jus] || "";
        M.toast({html: 'Registro seleccionado'});
    }

    function guardarCambios() {
        const i = document.getElementById('edit-idx').value;
        if(i === "-1") return alert("Seleccione una fila para editar");
        
        excelData[i][idx.ger] = document.getElementById('f-ger').value;
        excelData[i][idx.are] = document.getElementById('f-are').value;
        excelData[i][idx.alc] = document.getElementById('f-alc').value;
        excelData[i][idx.upd] = document.getElementById('f-upd').value;
        excelData[i][idx.fue] = document.getElementById('f-fue').value;
        excelData[i][idx.rea] = document.getElementById('f-rea').value;
        excelData[i][idx.pla] = document.getElementById('f-pla').value;
        excelData[i][idx.dis] = (document.getElementById('f-rea').value / document.getElementById('f-pla').value).toFixed(4);
        excelData[i][idx.jus] = document.getElementById('f-jus').value;

        renderizar();
        limpiarForm();
        M.toast({html: 'Registro actualizado'});
    }

    function eliminar(i) {
        if(confirm("¿Eliminar registro?")) {
            excelData.splice(i, 1);
            renderizar();
            M.toast({html: 'Registro eliminado'});
        }
    }

    function descargarExcel() {
        const ws = XLSX.utils.aoa_to_sheet(excelData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Datos");
        XLSX.writeFile(wb, "Control_Contingencia_Alcasa.xlsx");
    }

    function limpiarForm() {
        document.getElementById('edit-idx').value = "-1";
        document.querySelectorAll('.form-horizontal .smart-input, .form-horizontal select').forEach(inp => inp.value = "");
    }
    window.onload = () => { M.AutoInit(); };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
