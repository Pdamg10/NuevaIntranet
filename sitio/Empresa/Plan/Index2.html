<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CVG ALCASA - Control de Contingencia</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { --primary: #0d47a1; --secondary: #1565c0; --bg: #eceff1; --surface: #ffffff; --danger: #ff5252; --warning: #ffd740; --success: #69f0ae; }
        body { background: var(--bg); padding: 15px; font-family: 'Roboto', sans-serif; color: #37474f; }
        
        /* SEGURIDAD */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }

        .header-container { background: var(--surface); padding: 15px 30px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between; }
        .logo-box { display: flex; align-items: center; gap: 20px; }
        .logo-box img { height: 65px; width: auto; }
        .title-box h5 { margin: 0; font-weight: 800; color: var(--primary); font-size: 1.3rem; text-transform: uppercase; }
        .main-card { background: var(--surface); padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .contingencia-container { background: #263238; border-radius: 12px; border: 4px solid #90a4ae; overflow: hidden; position: relative; }
        .map-wrapper { position: relative; width: 100%; height: 500px; background: white; overflow: hidden; }
        .planta-img-bg { width: 100%; height: 100%; object-fit: contain; display: block; }
        .updi-marker { position: absolute; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 0.7rem; box-shadow: 0 0 12px rgba(0,0,0,0.5); border: 2px solid white; z-index: 5; text-align: center; transform: translate(-50%, -50%); cursor: pointer; transition: 0.2s; }
        .updi-marker:hover { transform: translate(-50%, -50%) scale(1.1); }
        .updi-detail-card { margin-top: 20px; background: white; border-radius: 12px; border-left: 8px solid var(--primary); padding: 20px; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .detail-item { background: #f8f9fb; padding: 10px; border-radius: 8px; border: 1px solid #e3e8ee; }
        .industrial-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 25px; background: #eceff1; }
        .galpon-block { background: white; border: 2px solid #546e7a; border-radius: 4px; padding: 15px; position: relative; min-height: 160px; }
        .galpon-header { font-weight: 900; border-bottom: 2px solid #eee; margin-bottom: 10px; padding-bottom: 5px; color: var(--primary); font-size: 0.9rem; }
        .stats-box { font-size: 1.2rem; font-weight: 800; margin: 10px 0; }
        .roof-line { position: absolute; top: 0; left: 0; width: 100%; height: 6px; }
        .form-section { background: #f8f9fb; padding: 20px; border-radius: 12px; border: 1px solid #e3e8ee; margin-bottom: 25px; }
        .input-group { background: white; padding: 5px 15px; border-radius: 8px; border: 1px solid #d1d9e2; margin-bottom: 10px; }
        .input-group label { font-size: 0.7rem; color: var(--primary); font-weight: 700; text-transform: uppercase; }
        .smart-input { border: none !important; margin: 0 !important; font-weight: 600; height: 1.8rem !important; outline: none; width: 100%; }
        .smart-area { border: none !important; margin: 0 !important; font-weight: 500; min-height: 40px; outline: none; width: 100%; resize: none; padding-top: 5px; }
        .records-container { border: 1px solid #e0e6ed; border-radius: 12px; overflow: hidden; background: white; }
        .table-scroll { max-height: 450px; overflow-y: auto; }
        thead th { position: sticky; top: 0; background: #fff !important; z-index: 10; border-bottom: 2px solid #e0e6ed !important; }
        .led { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle; }
        .bg-rojo { background-color: var(--danger); box-shadow: 0 0 8px var(--danger); }
        .bg-amarillo { background-color: var(--warning); box-shadow: 0 0 8px var(--warning); }
        .bg-verde { background-color: var(--success); box-shadow: 0 0 8px var(--success); }
        .btn-main { background: var(--primary); color: white; border-radius: 8px; padding: 10px 20px; border: none; cursor: pointer; font-weight: 700; width: 100%; height: 45px; }
        .btn-main.disabled { background: #b0bec5 !important; cursor: not-allowed; }
        .action-btn { cursor: pointer; margin: 0 5px; }
        .kpi-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e0e6ed; height: 100%; }
        .semaforo-global { width: 45px; height: 45px; border-radius: 50%; margin: 0 auto 10px; border: 2px solid #eee; }
        .filter-panel-dash { background: #f1f4f9; padding: 15px; border-radius: 12px; margin: 20px 0; border: 1px solid #e0e6ed; }
        .justificacion-text { background: #f5f7f9; padding: 8px; border-radius: 5px; font-size: 0.8rem; margin-top: 10px; border-left: 3px solid var(--primary); color: #455a64; font-style: italic; }
        .tabs .tab a { color: var(--primary) !important; font-weight: 700; }
        .tabs .indicator { background-color: var(--primary) !important; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <div class="center">
            <img src="http://alcasa.com.ve/sitio/Imagenes/Logo-CVG-Alcasa1.gif" style="height:80px;">
            <h5 style="font-weight:800; color:var(--primary); margin-top:20px;">ACCESO RESTRINGIDO</h5>
        </div>
        <div class="input-field">
            <i class="material-icons prefix">person</i>
            <input type="text" id="user-login">
            <label for="user-login">Usuario</label>
        </div>
        <div class="input-field">
            <i class="material-icons prefix">lock</i>
            <input type="password" id="pass-login">
            <label for="pass-login">Contraseña</label>
        </div>
        <button class="btn-main" onclick="validarAcceso()">ENTRAR AL SISTEMA</button>
    </div>
</div>

<div id="main-content" style="display:none;">
    <div class="header-container">
        <div class="logo-box">
            <img src="http://alcasa.com.ve/sitio/Imagenes/Logo-CVG-Alcasa1.gif" alt="Logo">
            <div class="title-box">
                <h5>SISTEMA DE CONTROL DE CONTINGENCIA</h5>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span id="display-user-name" class="grey-text text-darken-2" style="font-weight: 800; font-size: 0.8rem; border-right: 2px solid #ddd; padding-right: 10px; text-transform: uppercase;">USUARIO</span>
                    <span id="sync-status" class="blue-text" style="font-size: 0.7rem; font-weight: bold;">ESPERANDO VINCULACIÓN...</span>
                </div>
            </div>
        </div>
        <button class="btn-flat blue-text text-darken-4" onclick="vincularArchivo()" style="font-weight: 700;">📂 VINCULAR EXCEL (MODO COLABORATIVO)</button>
    </div>

    <div class="main-card">
        <div id="ui" style="display:none;">
            <ul class="tabs transparent">
                <li class="tab col s4"><a class="active" href="#edicion">GESTIÓN DE DATOS</a></li>
                <li class="tab col s4"><a href="#dashboard" onclick="renderDashboard()">TABLERO DE MANDO</a></li>
                <li class="tab col s4"><a href="#integral" onclick="renderIntegral()">TABLERO DE CONTINGENCIA</a></li>
            </ul>

            <div id="edicion" class="col s12">
                <div class="form-section" style="margin-top:20px;">
                    <input type="hidden" id="edit-index" value="-1">
                    <div class="row" style="margin-bottom:0;">
                        <div class="col s12 m3"><div class="input-group"><label>Gerencia</label><input type="text" id="f-gerencia" list="list-gerencia" class="smart-input"></div></div>
                        <div class="col s12 m3"><div class="input-group"><label>Área</label><input type="text" id="f-area" list="list-area" class="smart-input"></div></div>
                        <div class="col s12 m3"><div class="input-group"><label>Alcance</label><input type="text" id="f-alcance" list="list-alcance" class="smart-input"></div></div>
                        <div class="col s12 m3"><div class="input-group"><label>UPDI #</label><input type="text" id="f-updi" list="list-updi" class="smart-input"></div></div>
                    </div>
                    <div class="row" style="margin-top:10px;">
                        <div class="col s12 m2"><div class="input-group"><label>F.L. Total</label><input type="number" id="f-fuerza" class="smart-input"></div></div>
                        <div class="col s12 m2"><div class="input-group"><label>% Real</label><input type="number" id="f-real" class="smart-input"></div></div>
                        <div class="col s12 m2"><div class="input-group"><label>% Plan Meta</label><input type="number" id="f-plan" class="smart-input"></div></div>
                        <div class="col s12 m6"><div class="input-group"><label>Justificación</label><textarea id="f-justificacion" class="smart-area"></textarea></div></div>
                    </div>
                    <div class="row">
                        <div class="col s12 m6 offset-m3"><button id="btn-save" class="btn-main" onclick="procesarFormulario()">ACTUALIZAR Y GUARDAR EN EXCEL</button></div>
                        <div class="col s12 m3"><button class="btn-flat grey lighten-3" onclick="cancelarEdicion()" style="width:100%; border-radius:8px; height:45px;">LIMPIAR</button></div>
                    </div>
                </div>
                <div class="records-container">
                    <div class="table-scroll"><table class="centered highlight"><thead id="h-table-edicion"></thead><tbody id="b-table-edicion"></tbody></table></div>
                </div>
            </div>

            <div id="dashboard" class="col s12">
                <div class="filter-panel-dash"><div class="row" id="dash-filters-container" style="margin-bottom:0;"></div></div>
                <div id="kpi-dashboard" class="row"></div>
                <div class="row" id="grid-cards"></div>
            </div>

            <div id="integral" class="col s12" style="margin-top:20px;">
                <div class="contingencia-container">
                    <div class="map-wrapper" id="updi-map-area">
                        <img src="http://alcasa.com.ve/sitio/empresa/plan/VI Linea.jpg" class="planta-img-bg" alt="Planta">
                    </div>
                    <div id="updi-info-panel" class="updi-detail-card"></div>
                    <div class="industrial-grid" id="industrial-map"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<datalist id="list-gerencia"></datalist><datalist id="list-area"></datalist><datalist id="list-alcance"></datalist><datalist id="list-updi"></datalist>

<script>
    const USUARIOS_AUTORIZADOS = [
        { user: "admin", pass: "1234", nivel: "admin", nombreLargo: "admin / ADMINISTRADOR DEL SISTEMA" },
        { user: "alcasa", pass: "2026", nivel: "visor", nombreLargo: "alcasa / USUARIO DE PRUEBA" },
        { user: "sm25946", pass: "aa122525", nivel: "admin", nombreLargo: "sm25946 / SEBASTIAN MARCANO" },
        { user: "gc26665", pass: "familiacaldera", nivel: "admin", nombreLargo: "gc26665 / GUSTAVO CALDERA" }
    ];
    let nivelUsuarioActivo = "";

    function validarAcceso() {
        const u = document.getElementById('user-login').value;
        const p = document.getElementById('pass-login').value;
        const check = USUARIOS_AUTORIZADOS.find(usr => usr.user === u && usr.pass === p);
        if(check) {
            nivelUsuarioActivo = check.nivel;
            document.getElementById('display-user-name').innerText = check.nombreLargo;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            if(nivelUsuarioActivo === "visor") {
                const btnSave = document.getElementById('btn-save');
                btnSave.classList.add('disabled');
                btnSave.innerText = "ACCESO DE SOLO LECTURA";
                document.querySelectorAll('.smart-input, .smart-area').forEach(i => i.disabled = true);
            }
            M.toast({html: `Bienvenido: ${check.nombreLargo}`, classes: 'blue rounded'});
        } else {
            M.toast({html: 'Usuario o Clave Incorrecta', classes: 'red rounded'});
        }
    }

    let handle, excelData = [], idx = {}, filtersEdicion = { ger: '', are: '', alc: '' }, modoEdicionActivo = false;

    const updiCoords = {
        "1": { top: "60%", left: "49%" }, "2": { top: "37%", left: "47%" },
        "3": { top: "30%", left: "49%" }, "4": { top: "47%", left: "49%" },
        "5": { top: "43%", left: "62%" }, "6": { top: "43%", left: "52%" },
        "7": { top: "32%", left: "52%" }, "8": { top: "60%", left: "39%" },
        "9": { top: "53%", left: "52%" }
    };

    async function vincularArchivo() {
        try {
            [handle] = await window.showOpenFilePicker({ mode: 'readwrite', types: [{ description: 'Excel Files', accept: {'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx']} }] });
            await cargarYRenderizar();
            document.getElementById('ui').style.display = 'block';
            setInterval(async () => { if (!modoEdicionActivo && handle) await cargarYRenderizar(); }, 10000);
        } catch (e) { console.log("Vinculación denegada"); }
    }

    async function cargarYRenderizar() {
        try {
            const file = await handle.getFile();
            const data = await file.arrayBuffer();
            const wb = XLSX.read(data, {type: 'array'});
            excelData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1});
            mapear(); actualizarCatalogos(); renderTablas();
            document.getElementById('sync-status').innerText = "VINCULADO: " + new Date().toLocaleTimeString();
        } catch (e) { console.error(e); }
    }

    async function procesarFormulario() {
        if(nivelUsuarioActivo === "visor") return;
        const i = parseInt(document.getElementById('edit-index').value);
        const p = parseFloat(document.getElementById('f-plan').value)||0, r = parseFloat(document.getElementById('f-real').value)||0;
        const fila = i === -1 ? new Array(excelData[0].length).fill("") : excelData[i];
        fila[idx.gerencia] = document.getElementById('f-gerencia').value.trim();
        fila[idx.area] = document.getElementById('f-area').value.trim();
        fila[idx.alcance] = document.getElementById('f-alcance').value.trim();
        fila[idx.updi] = document.getElementById('f-updi').value.trim();
        fila[idx.fuerza] = parseFloat(document.getElementById('f-fuerza').value)||0;
        fila[idx.real] = r; fila[idx.plan] = p;
        fila[idx.disp] = p > 0 ? (r/p).toFixed(4) : 0;
        fila[idx.justificacion] = document.getElementById('f-justificacion').value.trim();
        if(i === -1) excelData.push(fila);
        try {
            const ws = XLSX.utils.aoa_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "DATOS");
            const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
            const writable = await handle.createWritable();
            await writable.write(wbout);
            await writable.close();
            M.toast({html: '✅ ARCHIVO ACTUALIZADO'});
            cancelarEdicion(); renderTablas();
        } catch (e) { M.toast({html: '❌ ERROR AL GUARDAR'}); }
    }

    function mapear() {
        const h = excelData[0].map(c => String(c).toUpperCase().trim());
        idx = { updi: h.findIndex(x => x.includes("UPDI")), gerencia: h.indexOf("GERENCIA"), alcance: h.findIndex(x => x.includes("ALCANCE")), fuerza: h.indexOf("FUERZA LABORAL"), area: h.indexOf("AREA"), real: h.indexOf("REAL"), plan: h.indexOf("PLAN"), disp: h.indexOf("DISP"), justificacion: h.indexOf("JUSTIFICACION") };
        if(idx.justificacion === -1) { excelData[0].push("JUSTIFICACION"); idx.justificacion = excelData[0].length - 1; }
    }

    function renderTablaEdicion() {
        const h = document.getElementById('h-table-edicion'), b = document.getElementById('b-table-edicion');
        if(!h || !b) return;
        const unique = (c) => [...new Set(excelData.slice(1).map(r => r[c]))].filter(Boolean).sort();
        let head = "<tr>";
        excelData[0].forEach((col, i) => {
            head += `<th>${col}`;
            if([idx.gerencia, idx.area, idx.alcance].includes(i)) {
                const key = i === idx.gerencia ? 'ger' : i === idx.area ? 'are' : 'alc';
                head += `<select class="browser-default header-filter" onchange="filtersEdicion.${key}=this.value; renderTablaEdicion()"><option value="">TODOS</option>${unique(i).map(v => `<option value="${v}" ${filtersEdicion[key]===v?'selected':''}>${v}</option>`).join('')}</select>`;
            }
            head += "</th>";
        });
        const accionesHead = nivelUsuarioActivo === "admin" ? "<th>ACCIONES</th>" : "";
        h.innerHTML = head + accionesHead + "</tr>";
        let body = "";
        excelData.slice(1).forEach((row, realIdx) => {
            if((filtersEdicion.ger && row[idx.gerencia] !== filtersEdicion.ger) || (filtersEdicion.are && row[idx.area] !== filtersEdicion.are) || (filtersEdicion.alc && row[idx.alcance] !== filtersEdicion.alc)) return;
            let rowHtml = "";
            excelData[0].forEach((colName, colIdx) => {
                let cellData = row[colIdx] || "";
                if(colIdx === idx.disp) {
                    const r = parseFloat(row[idx.real]) || 0, p = parseFloat(row[idx.plan]) || 0;
                    const d = p > 0 ? (r / p) : 0;
                    rowHtml += `<td><span class="led bg-${d < 0.5 ? 'rojo' : d < 0.8 ? 'amarillo' : 'verde'}"></span>${(d*100).toFixed(0)}%</td>`;
                } else { rowHtml += `<td>${cellData}</td>`; }
            });
            const accionesBody = nivelUsuarioActivo === "admin" ? `<td><i class="material-icons blue-text action-btn" onclick="cargarParaEditar(${realIdx+1})">edit</i><i class="material-icons red-text action-btn" onclick="eliminarFila(${realIdx+1})">delete</i></td>` : "";
            body += `<tr>${rowHtml}${accionesBody}</tr>`;
        });
        b.innerHTML = body;
    }

    function renderDashboard() {
        const unique = (c) => [...new Set(excelData.slice(1).map(r => r[c]))].filter(Boolean).sort();
        document.getElementById('dash-filters-container').innerHTML = `
            <div class="col s12 m4"><label>GERENCIA</label><select class="browser-default" onchange="filtersEdicion.ger=this.value; renderDashboard()"><option value="">TODAS</option>${unique(idx.gerencia).map(v => `<option value="${v}" ${filtersEdicion.ger===v?'selected':''}>${v}</option>`).join('')}</select></div>
            <div class="col s12 m4"><label>ÁREA</label><select class="browser-default" onchange="filtersEdicion.are=this.value; renderDashboard()"><option value="">TODAS</option>${unique(idx.area).map(v => `<option value="${v}" ${filtersEdicion.are===v?'selected':''}>${v}</option>`).join('')}</select></div>
            <div class="col s12 m4"><label>ALCANCE</label><select class="browser-default" onchange="filtersEdicion.alc=this.value; renderDashboard()"><option value="">TODOS</option>${unique(idx.alcance).map(v => `<option value="${v}" ${filtersEdicion.alc===v?'selected':''}>${v}</option>`).join('')}</select></div>`;
        let sumD = 0, sFLT = 0, sFLR = 0, sFLP = 0, count = 0, cards = "";
        excelData.slice(1).forEach(row => {
            if((filtersEdicion.ger && row[idx.gerencia] !== filtersEdicion.ger) || (filtersEdicion.are && row[idx.area] !== filtersEdicion.are) || (filtersEdicion.alc && row[idx.alcance] !== filtersEdicion.alc)) return;
            const flt = parseFloat(row[idx.fuerza]) || 0;
            const rPct = parseFloat(row[idx.real])||0, pPct = parseFloat(row[idx.plan])||0;
            const d = pPct > 0 ? (rPct / pPct) : 0;
            const flr = Math.round((rPct/100)*flt); const flp = Math.round((pPct/100)*flt);
            const s = d < 0.5 ? 'rojo' : d < 0.8 ? 'amarillo' : 'verde';
            sumD += d; sFLT += flt; sFLR += flr; sFLP += flp; count++;
            cards += `<div class="col s12 m4"><div class="kpi-card" style="text-align:left; border-left:5px solid var(--${s==='rojo'?'danger':s==='amarillo'?'warning':'success'}); padding:15px;">
                <span class="grey-text tiny" style="font-weight:700">${row[idx.gerencia]}</span>
                <h6 style="font-weight:700; margin:5px 0; color:var(--primary);">${row[idx.area]}</h6>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;"><span>Disp: <b>${(d*100).toFixed(0)}%</b></span><span class="led bg-${s}"></span></div>
                <div style="font-size:0.8rem; color:#78909c; margin-bottom:5px;">Plan: <b>${pPct}%</b> | Real: <b>${rPct}%</b></div>
                <div style="color:#546e7a; font-size:0.8rem; border-top:1px solid #eee; padding-top:5px;">F.L.T: <b>${flt}</b> | F.L.R: <b>${flr}</b> | F.L.P: <b>${flp}</b></div>
                ${row[idx.justificacion] ? `<div class="justificacion-text">"${row[idx.justificacion]}"</div>` : ''}
            </div></div>`;
        });
        document.getElementById('grid-cards').innerHTML = cards;
        const promDisp = count > 0 ? (sumD / count) : 0;
        document.getElementById('kpi-dashboard').innerHTML = `
            <div class="col s12 m4 l2"><div class="kpi-card"><div class="semaforo-global bg-${promDisp < 0.5 ? 'rojo' : promDisp < 0.8 ? 'amarillo' : 'verde'}"></div><small>ESTADO</small></div></div>
            <div class="col s12 m4 l2"><div class="kpi-card"><h4>${(promDisp*100).toFixed(1)}%</h4><small>PROM. DISP.</small></div></div>
            <div class="col s12 m4 l2"><div class="kpi-card"><h4>${sFLT}</h4><small>TOTAL F.L.T.</small></div></div>
            <div class="col s12 m4 l3"><div class="kpi-card"><h4>${sFLR}</h4><small>TOTAL F.L.R.</small></div></div>
            <div class="col s12 m4 l3"><div class="kpi-card"><h4>${sFLP}</h4><small>TOTAL F.L.P.</small></div></div>`;
    }

    function renderIntegral() {
        const gerencias = {}, updiStats = {}, updiDetails = {};
        const mapArea = document.getElementById('updi-map-area');
        mapArea.querySelectorAll('.updi-marker').forEach(m => m.remove());
        
        excelData.slice(1).forEach(row => {
            const ger = row[idx.gerencia]; if(!ger) return;
            const uRaw = String(row[idx.updi]).toUpperCase().replace("UPDI", "").trim();
            const flt = parseFloat(row[idx.fuerza]) || 0;
            const rPct = parseFloat(row[idx.real]) || 0, pPct = parseFloat(row[idx.plan]) || 0;
            const flr = Math.round((rPct / 100) * flt); 
            const flp = Math.round((pPct / 100) * flt);
            
            if(!gerencias[ger]) gerencias[ger] = { totalFLT: 0, totalFLR: 0, totalFLP: 0, updiAsociada: uRaw };
            gerencias[ger].totalFLT += flt; 
            gerencias[ger].totalFLR += flr;
            gerencias[ger].totalFLP += flp;

            if(uRaw && updiCoords[uRaw]) {
                if(!updiStats[uRaw]) { updiStats[uRaw] = { sumFLR: 0, sumFLP: 0 }; updiDetails[uRaw] = []; }
                updiStats[uRaw].sumFLR += flr; 
                updiStats[uRaw].sumFLP += flp;
                updiDetails[uRaw].push({ area: row[idx.area], r: rPct, p: pPct, flr: flr, flp: flp, gerencia: ger, just: row[idx.justificacion] });
            }
        });

        let html = "";
        const gerenciaColors = {}; 
        
        Object.keys(gerencias).forEach(g => {
            const data = gerencias[g]; 
            const dAvg = data.totalFLP > 0 ? (data.totalFLR / data.totalFLP) : 0;
            const statusClass = dAvg < 0.5 ? 'rojo' : dAvg < 0.8 ? 'amarillo' : 'verde';
            gerenciaColors[data.updiAsociada] = statusClass;
            
            html += `
                <div class="galpon-block">
                    <div class="roof-line bg-${statusClass}"></div>
                    <div class="galpon-header">${g}</div>
                    <div class="stats-box">F.L. ${data.totalFLR} / ${data.totalFLP}</div>
                    <div style="font-size:0.75rem; font-weight:bold;">
                        <span class="led bg-${statusClass}"></span> DISP: ${(dAvg*100).toFixed(1)}%
                    </div>
                    <div style="font-size:1.2rem; color:var(--primary); font-weight:900; margin-top:8px; border-top: 1px solid #f0f0f0; padding-top: 5px;">
                        UPDI ${data.updiAsociada}
                    </div>
                </div>`;
        });
        document.getElementById('industrial-map').innerHTML = html;

        Object.keys(updiStats).forEach(u => {
            const pos = updiCoords[u];
            const colorAsignado = gerenciaColors[u] || 'verde';
            const dot = document.createElement('div');
            dot.className = `updi-marker bg-${colorAsignado}`;
            dot.style.top = pos.top; dot.style.left = pos.left; dot.innerHTML = `UPDI<br>${u}`;
            const avgUPDI = updiStats[u].sumFLP > 0 ? (updiStats[u].sumFLR / updiStats[u].sumFLP) : 0;
            dot.onclick = () => mostrarDetalleUPDI(u, avgUPDI, updiDetails[u]);
            mapArea.appendChild(dot);
        });
    }

    function mostrarDetalleUPDI(numero, promedio, lista) {
        const panel = document.getElementById('updi-info-panel');
        const s = promedio < 0.5 ? 'rojo' : promedio < 0.8 ? 'amarillo' : 'verde';
        const gerenciaNombre = lista.length > 0 ? lista[0].gerencia : "N/A";
        
        let detHtml = `
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #eee; padding-bottom:10px;">
                <div style="display:flex; align-items:center;">
                    <div>
                        <h5 style="margin:0; font-weight:800; color:var(--primary);">UPDI ${numero}</h5>
                        <small style="color:#546e7a; font-weight:bold;">GERENCIA: ${gerenciaNombre}</small>
                    </div>
                    <div style="margin-left:20px; display:flex; align-items:center;">
                        <span class="led bg-${s}"></span>
                        <b style="color:#546e7a;">DISP. PROM: ${(promedio*100).toFixed(1)}%</b>
                    </div>
                </div>
                <i class="material-icons" style="cursor:pointer" onclick="document.getElementById('updi-info-panel').style.display='none'">close</i>
            </div>
            <div class="detail-grid">`;
            
        lista.forEach(i => { 
            const dArea = i.flp > 0 ? (i.flr / i.flp) : 0;
            const statusArea = dArea < 0.5 ? 'rojo' : dArea < 0.8 ? 'amarillo' : 'verde';
            detHtml += `
                <div class="detail-item">
                    <div style="font-weight:700;"><span class="led bg-${statusArea}"></span> ${i.area}</div>
                    <div>Disp: <b>${(dArea*100).toFixed(0)}%</b> (R: ${i.r}% / P: ${i.p}%)</div>
                    ${i.just ? `<div class="justificacion-text" style="margin-top:5px; font-size:0.75rem;">"${i.just}"</div>` : ''}
                </div>`; 
        });
        panel.innerHTML = detHtml + `</div>`; 
        panel.style.display = 'block';
        window.scrollTo({top: document.getElementById('integral').offsetTop, behavior: 'smooth'});
    }

    function cargarParaEditar(i) { 
        if(nivelUsuarioActivo !== "admin") return;
        modoEdicionActivo = true; const row = excelData[i]; document.getElementById('edit-index').value = i; 
        document.getElementById('f-gerencia').value = row[idx.gerencia] || ""; document.getElementById('f-area').value = row[idx.area] || ""; 
        document.getElementById('f-alcance').value = row[idx.alcance] || ""; document.getElementById('f-updi').value = row[idx.updi] || ""; 
        document.getElementById('f-fuerza').value = row[idx.fuerza] || ""; document.getElementById('f-real').value = row[idx.real] || ""; 
        document.getElementById('f-plan').value = row[idx.plan] || ""; document.getElementById('f-justificacion').value = row[idx.justificacion] || ""; 
        window.scrollTo({top:0, behavior:'smooth'}); 
    }
    
    function cancelarEdicion() { modoEdicionActivo = false; document.getElementById('edit-index').value = "-1"; ["f-gerencia","f-area","f-alcance","f-updi","f-fuerza","f-real","f-plan","f-justificacion"].forEach(id => document.getElementById(id).value = ""); }
    function actualizarCatalogos() { const getU = (c) => [...new Set(excelData.slice(1).map(r => r[c]))].filter(Boolean).sort(); const fill = (id, vals) => document.getElementById(id).innerHTML = vals.map(v => `<option value="${v}">`).join(''); fill('list-gerencia', getU(idx.gerencia)); fill('list-area', getU(idx.area)); fill('list-alcance', getU(idx.alcance)); fill('list-updi', getU(idx.updi)); }
    function renderTablas() { renderTablaEdicion(); renderDashboard(); renderIntegral(); }
    window.onload = () => { M.AutoInit(); };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
