<html>

<head>

<style type="text/css">

body{
  background-color: lightgrey;
  font-family: sans-serif;
}

div {
  transition-property: opacity, left, top, height;
  transition-duration: 10s, 5s;
}

.container{
  margin: auto;
  background-color: white;
  width: 780px;
  padding: 1px;
  overflow: hidden;
}

ul, li {
    padding: 0;
    margin: 0;
    list-style: none;
}

ul.slider{
  display: flex;
  position: relative;
  width: 780px;
  height: 205px;
}

ul.slider li {
    position: absolute;
    left: 0px;
    top: 40px;
    opacity: 0;
    width: inherit;
    height: inherit;
    transition: opacity .1s;
    background:#fff;
}

ul.slider li img{
  width: 100%;
  height: 200px;
  object-fit: cover;
}

ul.slider li:first-child {
    opacity: 1; /*Mostramos el primer <li>*/
}

ul.slider li:target {
    opacity: 1; /*Mostramos el <li> del enlace que pulsemos*/
}

.menu{
  text-align: center;
  margin: 20px;
}

.menu li{
  display: inline-block;
  text-align: center;
}

.menu li a{
  transition-duration: 10s;
  display: inline-block;
  color: white;
  text-decoration: none;
  background-color: #0e39ac;
  padding: 10px;
  width: 20px;
  height: 20px;
  font-size: 20px;
  border-radius: 100%;
}

ul.menu li a:hover, a:active {
  transition-duration: 10s;
  display: inline-block;
  text-decoration: none;
  font-weight: bold;
  color: #0eaca5;
  background-color: red;
  padding: 10px;
  width: 20px;
  height: 20px;
  font-size: 20px;
  border-radius: 100%;
}


@keyframes cambio {
	0% {margin-left: 0;}
	20% {margin-left: 0;}
	
	25% {margin-left: -100%;}
	45% {margin-left: -100%;}
	
	50% {margin-left: -200%;}
	70% {margin-left: -200%;}
	
	75% {margin-left: -300%;}
	100% {margin-left: -300%;}
}


</style>

<script language="javascript" type="text/javascript">

</script>

</head>

<body>

<div class="container">  
  <ul class="slider">
    <li id="slide1">
      <a href="NuestrosProductos/Productos_Laminacion.htm">
      <img src="BANNER%202023/Pantalla780x200 LAMINACION.jpg" width="780" height="200"/></a>  
    </li>
    <li id="slide2">
      <a href="NuestrosProductos/Productos_Fundicion.htm">
      <img src="BANNER%202023/Pantalla780x200 FUNDICION.JPG" width="780" height="200"/></a> 
    </li>
    <li id="slide3">
      <a href="NuestrosProductos/Productos_Extrusion.htm">
      <img src="BANNER%202023/Pantalla780x200 EXTRUSORA.JPG" width="780" height="200"/></a>
    </li>
  </ul>
  <ul class="menu">
    <li>
      <a href="#slide1" color: #0eaca5>1</a> 
    </li>
    <li>
      <a href="#slide2" color: #0eaca5>2</a>
    </li>
     <li>
      <a href="#slide3"color: #0eaca5>3</a>
    </li>
  </ul>
</div>

</body>

</html>
