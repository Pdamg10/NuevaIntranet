<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Rápido de Clave CSV</title>
    <style>
        /* Estilos Omitidos por brevedad, son los mismos que antes */
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #e6f7ff; }
        .container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15); }
        input[type="text"] { display: block; width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #007bff; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        #results-box { margin-top: 20px; padding: 15px; border: 2px solid #28a745; border-radius: 8px; background-color: #d4edda; color: #155724; font-size: 1.2em; font-weight: bold; text-align: center; }
        .error-message { border-color: #dc3545 !important; background-color: #f8d7da !important; color: #721c24 !important; }
        #loadStatus { margin-bottom: 15px; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Buscador de Claves Optimizado</h1>
    <p id="loadStatus">Cargando datos desde: **Usuario_ARI.csv**...</p>
    
    <hr>

    <h2>Buscar Usuario</h2>
    <input type="text" id="searchInput" placeholder="Ingresa Cédula o Ficha (Ej: 9952487 o 26644)">

    <h3>Clave Encontrada:</h3>
    <div id="results-box">
        La clave aparecerá aquí.
    </div>
</div>

<script>
    const CSV_FILE_PATH = 'Usuario_ARI.csv';
    const DELIMITER = ';'; 
    
    // Referencias al DOM
    const searchInput = document.getElementById('searchInput');
    const resultsBox = document.getElementById('results-box');
    const loadStatus = document.getElementById('loadStatus');

    // **CAMBIO CLAVE**: Usamos un Map para un acceso O(1) (casi instantáneo)
    let allDataMap = new Map(); 

    // Función para mostrar mensajes de resultado/error
    function displayResult(message, isError = false) {
        resultsBox.textContent = message;
        resultsBox.className = 'results-box' + (isError ? ' error-message' : '');
    }

    // 1. Función de Parseo y Creación del Mapa Hash
    function parseCSV(csvText) {
        const lines = csvText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
        if (lines.length <= 1) return new Map();

        const headers = lines[0].split(DELIMITER).map(h => h.trim());
        const tempMap = new Map();

        lines.slice(1).forEach(line => {
            const values = line.split(DELIMITER).map(v => v.trim());
            if (values.length !== headers.length) return; // Ignorar filas incompletas

            const rowObject = {};
            headers.forEach((header, index) => {
                rowObject[header] = values[index];
            });

            // --- OPTIMIZACIÓN: Crear dos entradas por registro ---
            const cedula = String(rowObject['cedula']).trim();
            const ficha = String(rowObject['ficha']).trim();
            
            // Usamos el registro completo como valor para ambas claves
            if (cedula && cedula !== 'undefined') {
                 // La clave en el Map es la cédula, el valor es el registro
                tempMap.set(cedula, rowObject);
            }
            if (ficha && ficha !== 'undefined' && ficha !== cedula) {
                // La clave en el Map es la ficha, el valor es el mismo registro
                tempMap.set(ficha, rowObject);
            }
        });

        return tempMap;
    }

    // 2. Función de Carga (sin cambios)
    async function loadCSVFile() {
        try {
            const response = await fetch(CSV_FILE_PATH);
            
            if (!response.ok) {
                throw new Error(`Error ${response.status}: Asegúrate de que "${CSV_FILE_PATH}" esté en la misma carpeta.`);
            }

            const csvText = await response.text();
            allDataMap = parseCSV(csvText); // Cargar el Map en la variable global
            
            if (allDataMap.size > 0) {
                loadStatus.textContent = `✅ Archivo cargado exitosamente. ${allDataMap.size / 2} registros listos.`;
                loadStatus.style.color = '#28a745';
                searchInput.disabled = false; 
                searchInput.placeholder = "¡Búsqueda ultrarrápida habilitada!";
                displayResult('Ingresa un número de Cédula o Ficha.');
            } else {
                throw new Error("El archivo se cargó, pero está vacío o el formato es incorrecto.");
            }

        } catch (error) {
            loadStatus.textContent = `❌ ERROR de carga: ${error.message}`;
            loadStatus.style.color = '#dc3545';
            searchInput.disabled = true;
            displayResult('Error al cargar el archivo. Revisa el mensaje de error de carga.', true);
            console.error(error);
        }
    }

    // 3. Función de Búsqueda OPTIMIZADA
    function searchData(searchTerm) {
        const term = searchTerm.trim(); // No es necesario convertir a minúsculas si los IDs son números/strings puros
        
        if (allDataMap.size === 0) {
            displayResult('ERROR: El archivo no se cargó correctamente.', true);
            return;
        }

        if (term.length === 0) {
            displayResult('Ingresa un número de Cédula o Ficha.', false);
            return;
        }

        // --- OPTIMIZACIÓN CLAVE: Acceso directo al Map ---
        const foundRow = allDataMap.get(term); // ¡Esta es la búsqueda O(1) instantánea!

        if (foundRow) {
            const clave = foundRow['clave'];
            if (clave) {
                displayResult(`Clave para ${term}: **${clave}**`);
            } else {
                displayResult(`ERROR: La columna 'clave' no se encontró o está vacía para ${term}.`, true);
            }
        } else {
            displayResult(`No se encontró la Cédula o Ficha ${term} en el archivo.`, true);
        }
    }

    // 4. Event Listener con Debounce (sin cambios, ya era una buena práctica)
    searchInput.addEventListener('input', (event) => {
        // El debounce asegura que no se ejecute la búsqueda hasta que el usuario deje de escribir
        clearTimeout(window.searchTimeout);
        window.searchTimeout = setTimeout(() => {
            searchData(event.target.value);
        }, 200); // Reducido a 200ms para que se sienta más rápido
    });
    
    // Ejecutar la carga del archivo al iniciar la página
    searchInput.disabled = true; 
    loadCSVFile();
    displayResult('Esperando la carga del archivo...');

</script>

</body>
</html>
