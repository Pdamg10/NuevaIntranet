<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Clave CSV (Carga Directa)</title>
    <style>
        /* Estilos básicos */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #e6f7ff;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        input[type="text"] {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #007bff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        #results-box {
            margin-top: 20px;
            padding: 15px;
            border: 2px solid #28a745;
            border-radius: 8px;
            background-color: #d4edda;
            color: #155724;
            font-size: 1.2em;
            font-weight: bold;
            text-align: center;
        }
        .error-message {
            border-color: #dc3545 !important;
            background-color: #f8d7da !important;
            color: #721c24 !important;
        }
        #loadStatus {
            margin-bottom: 15px;
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔑 Buscador de Claves (Carga Automática)</h1>

    <p id="loadStatus">Cargando datos desde: **Usuario_ARI.csv**...</p>
    
    <hr>

    <h2>Buscar Usuario</h2>
    <input type="text" id="searchInput" placeholder="Ingresa Cédula o Ficha (Ej: 9952487 o 26644)">

    <h3>Clave Encontrada:</h3>
    <div id="results-box">
        La clave aparecerá aquí.
    </div>
</div>

<script>
    // *************************************************************
    // * LA UBICACIÓN DEFINIDA POR CÓDIGO *
    // * La ruta es RELATIVA al archivo HTML, asumiendo que ambos
    // * están en la misma carpeta.
    // *************************************************************
    const CSV_FILE_PATH = 'Usuario_ARI.csv';
    const DELIMITER = ';'; 
    // *************************************************************
    
    // Referencias a elementos del DOM
    const searchInput = document.getElementById('searchInput');
    const resultsBox = document.getElementById('results-box');
    const loadStatus = document.getElementById('loadStatus');

    let allData = []; 

    // Función para mostrar mensajes de resultado/error
    function displayResult(message, isError = false) {
        resultsBox.textContent = message;
        resultsBox.className = 'results-box' + (isError ? ' error-message' : '');
    }

    // 1. Función para parsear el CSV
    function parseCSV(csvText) {
        const lines = csvText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
        if (lines.length <= 1) return [];

        const headers = lines[0].split(DELIMITER).map(h => h.trim());
        const data = lines.slice(1).map(line => {
            const values = line.split(DELIMITER).map(v => v.trim());
            const rowObject = {};
            
            headers.forEach((header, index) => {
                rowObject[header] = values[index];
            });
            // Sólo devuelve filas que tienen el número correcto de columnas
            return rowObject; 
        }).filter(row => Object.keys(row).length === headers.length); 

        return data;
    }

    // 2. Función para CARGAR el archivo usando la ruta definida
    async function loadCSVFile() {
        try {
            // Intentar cargar el archivo desde la ruta definida
            const response = await fetch(CSV_FILE_PATH);
            
            if (!response.ok) {
                throw new Error(`Error ${response.status}: No se pudo acceder al archivo. Asegúrate de que "${CSV_FILE_PATH}" esté en la misma carpeta.`);
            }

            const csvText = await response.text();
            allData = parseCSV(csvText);
            
            if (allData.length > 0) {
                loadStatus.textContent = `✅ Archivo cargado exitosamente. ${allData.length} registros listos.`;
                loadStatus.style.color = '#28a745';
                searchInput.disabled = false; 
                searchInput.placeholder = "¡Busca la Cédula o Ficha ahora!";
                displayResult('Ingresa un número de Cédula o Ficha.');
            } else {
                throw new Error("El archivo se cargó, pero está vacío o el formato de datos es incorrecto.");
            }

        } catch (error) {
            loadStatus.textContent = `❌ ERROR de carga: ${error.message}`;
            loadStatus.style.color = '#dc3545';
            searchInput.disabled = true;
            displayResult('Error al cargar el archivo. Revisa el mensaje de error de carga.', true);
            console.error(error);
        }
    }

    // 3. Función de Búsqueda y Filtrado
    function searchData(searchTerm) {
        const term = searchTerm.trim().toLowerCase();
        
        if (allData.length === 0) {
            displayResult('ERROR: El archivo no se cargó correctamente.', true);
            return;
        }

        if (term.length === 0) {
            displayResult('Ingresa un número de Cédula o Ficha.', false);
            return;
        }

        // Buscar en las columnas 'cedula' o 'ficha'
        const foundRow = allData.find(row => {
            const cedula = String(row['cedula'] || '').toLowerCase();
            const ficha = String(row['ficha'] || '').toLowerCase();
            
            return cedula === term || ficha === term;
        });

        if (foundRow) {
            const clave = foundRow['clave'];
            if (clave) {
                displayResult(`Clave para ${term}: **${clave}**`);
            } else {
                displayResult(`ERROR: La columna 'clave' no se encontró o está vacía para ${term}.`, true);
            }
        } else {
            displayResult(`No se encontró la Cédula o Ficha ${term} en el archivo.`, true);
        }
    }

    // 4. Event Listener para la Búsqueda
    searchInput.addEventListener('input', (event) => {
        clearTimeout(window.searchTimeout);
        window.searchTimeout = setTimeout(() => {
            searchData(event.target.value);
        }, 300); 
    });
    
    // Ejecutar la carga del archivo al iniciar la página
    searchInput.disabled = true; 
    loadCSVFile();
    displayResult('Esperando la carga del archivo...');

</script>

</body>
</html>
