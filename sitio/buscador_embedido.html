    // *************************************************************
    // * PASO 2: CONFIGURACIÓN Y VARIABLES
    // *************************************************************
    const resultsBox = document.getElementById('results-box');
    const searchInput = document.getElementById('searchInput');
    const loadStatus = document.getElementById('loadStatus');
    
    // Variables de estado
    let allDataMap = new Map(); // Mantiene todos los datos, indexados por Cédula y Ficha.
    let isDataReady = false;
    let currentSearchStep = 1; // 1: Busca Cédula/Ficha, 2: Busca Fecha
    let foundUserData = null; // Almacena la fila de datos si el Paso 1 es exitoso.

    // --- Funciones de Utilidad ---
    function displayResult(message, isError = false) {
        resultsBox.textContent = message;
        resultsBox.className = isError ? 'error-message' : '';
    }
    
    // Función para resetear la búsqueda
    function resetSearch() {
        currentSearchStep = 1;
        foundUserData = null;
        searchInput.value = '';
        searchInput.placeholder = "Ingresa Cédula o Ficha...";
        document.querySelector('h2').textContent = 'Paso 1: Identificación';
        displayResult('La clave aparecerá aquí después de la doble validación.');
    }

    // *************************************************************
    // * PASO 3: LÓGICA DE PROCESAMIENTO DE DATOS (Indexación por Cédula/Ficha)
    // *************************************************************
    function processCSVData(csvContent) {
        loadStatus.textContent = 'Procesando datos...';
        
        const lines = csvContent.trim().split('\n').filter(line => line.trim() !== '');
        if (lines.length === 0) {
            displayResult('ERROR: No hay datos para procesar.', true);
            return;
        }

        const headers = lines[0].split(';');
        const indices = {
            cedula: headers.indexOf('cedula'),
            ficha: headers.indexOf('ficha'),
            fecha: headers.indexOf('Fecha'),
            clave: headers.indexOf('clave')
        };

        if (Object.values(indices).includes(-1)) {
            displayResult('ERROR: Faltan columnas esenciales (cedula, ficha, Fecha, o clave) en el CSV.', true);
            return;
        }

        let map = new Map();
        for (let i = 1; i < lines.length; i++) {
            const values = lines[i].split(';');
            
            const row = {};
            headers.forEach((header, index) => {
                row[header] = values[index] ? values[index].trim() : '';
            });

            // Indexar por Cedula y Ficha. (La validación de Fecha se hará después)
            if (row.cedula) map.set(row.cedula, row);
            if (row.ficha) map.set(row.ficha, row);
        }
        
        allDataMap = map;
        isDataReady = true;
        loadStatus.textContent = `✅ Datos cargados: ${allDataMap.size} entradas únicas. Listo para buscar.`;
        searchInput.placeholder = "Ingresa Cédula o Ficha...";
        searchInput.disabled = false;
    }
    
    // *************************************************************
    // * PASO 4: LÓGICA DE BÚSQUEDA MULTI-ETAPA
    // *************************************************************
    function searchData(searchTerm) {
        const term = searchTerm.trim();
        
        if (!isDataReady) {
            displayResult('Los datos aún se están cargando. Espera un momento.', true);
            return;
        }

        if (term.length === 0) {
            displayResult('El campo no puede estar vacío.', false);
            return;
        }
        
        // --- Etapa 1: Búsqueda por Cédula/Ficha ---
        if (currentSearchStep === 1) {
            
            foundUserData = allDataMap.get(term); 

            if (foundUserData) {
                // Éxito en la Etapa 1. Pasar a la Etapa 2.
                currentSearchStep = 2;
                searchInput.value = '';
                searchInput.placeholder = "Ingresa tu Fecha de Nacimiento (DD/MM/YYYY)...";
                document.querySelector('h2').textContent = 'Paso 2: Validación de Fecha de Nacimiento';
                displayResult(`✅ Cédula/Ficha encontrada. Por favor, ingresa tu **Fecha** de nacimiento para validar, Ejemplo 02/05/1973.`);
                
            } else {
                displayResult(`No se encontró la Cédula o Ficha ${term}.`, true);
            }
            return;
        }

        // --- Etapa 2: Validación por Fecha ---
        if (currentSearchStep === 2) {
            
            const expectedDate = foundUserData.Fecha; 
            
            if (term === expectedDate) {
                // Éxito en la Etapa 2. Mostrar Clave.
                const clave = foundUserData.clave;
                
                if (clave) {
                    displayResult(`¡Acceso Verificado! Clave para el usuario: ${clave}`);
                } else {
                    displayResult(`ERROR: Clave no registrada para este usuario.`, true);
                }
                
                // Opcional: Permitir ver la clave un momento y luego resetear
                setTimeout(resetSearch, 15000); // 15 segundos antes de resetear
                
            } else {
                // Error en la Etapa 2.
                displayResult(`❌ Fecha incorrecta. Vuelve a intentar o haz clic para empezar de nuevo.`, true);
                
                // Reseteamos el proceso si hay un error
                setTimeout(resetSearch, 5000); 
            }
            return;
        }
    }

    // *************************************************************
    // * PASO 5: EVENTO DE BÚSQUEDA E INICIALIZACIÓN
    // *************************************************************
    // Usaremos el evento 'change' (Enter o pérdida de foco) para manejar cada paso.
    searchInput.addEventListener('change', (event) => {
        searchData(event.target.value);
    });

    // Permitir clic para resetear si hay un error o al ver la clave
    resultsBox.addEventListener('click', () => {
        if (currentSearchStep === 2 && (resultsBox.classList.contains('error-message') || foundUserData.clave)) {
            resetSearch();
        }
    });

    // --- Inicialización de la Aplicación ---
    processCSVData(EMBEDDED_CSV_DATA);
