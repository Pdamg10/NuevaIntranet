<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Carga Manual y Rápida</title>
    <style>
        /* Estilos Omitidos por brevedad */
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f7fff7; }
        .container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1); }
        input[type="file"], input[type="text"] { display: block; width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #007bff; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        #results-box { margin-top: 20px; padding: 15px; border: 2px solid #28a745; border-radius: 8px; background-color: #d4edda; color: #155724; font-size: 1.2em; font-weight: bold; text-align: center; }
        .error-message { border-color: #dc3545 !important; background-color: #f8d7da !important; color: #721c24 !important; }
        #loadStatus { margin-bottom: 15px; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔑 Buscador Final de Claves</h1>

    <label for="csvFile">Cargar archivo CSV (Usuario_ARI.csv):</label>
    <input type="file" id="csvFile" accept=".csv">
    <p id="loadStatus">Esperando que cargues el archivo...</p>
    
    <hr>

    <h2>Buscar Usuario</h2>
    <input type="text" id="searchInput" placeholder="Esperando procesamiento de datos..." disabled>

    <h3>Clave Encontrada:</h3>
    <div id="results-box">
        La clave aparecerá aquí.
    </div>
</div>

<script>
    const WORKER_SCRIPT = 'procesador_worker.js';

    const csvFile = document.getElementById('csvFile');
    const searchInput = document.getElementById('searchInput');
    const resultsBox = document.getElementById('results-box');
    const loadStatus = document.getElementById('loadStatus');

    let allDataMap = null; 
    let isDataReady = false;
    let worker = null; // Instancia global del worker

    function displayResult(message, isError = false) {
        resultsBox.textContent = message;
        resultsBox.className = 'results-box' + (isError ? ' error-message' : '');
    }

    // --- Lógica del Web Worker ---
    function initWorker() {
        if (!window.Worker) {
            loadStatus.textContent = "❌ ERROR: Tu navegador no soporta Web Workers.";
            return;
        }

        // 1. Crear el Worker una sola vez
        worker = new Worker(WORKER_SCRIPT);
        
        // 2. Definir el manejador de mensajes del Worker
        worker.onmessage = function(event) {
            const data = event.data;
            
            if (data.status === 'success') {
                allDataMap = new Map(data.dataMap);
                isDataReady = true;

                loadStatus.textContent = `✅ Carga y procesamiento completo.`;
                loadStatus.style.color = '#28a745';
                searchInput.disabled = false;
                searchInput.placeholder = "¡Búsqueda instantánea habilitada!";
                displayResult('Ingresa un número de Cédula o Ficha.');
            } else {
                loadStatus.textContent = `❌ ERROR: ${data.message}`;
                loadStatus.style.color = '#dc3545';
                searchInput.disabled = true;
                displayResult('Error al procesar los datos.', true);
            }
        };
        
        worker.onerror = function(error) {
             loadStatus.textContent = `❌ ERROR: No se pudo cargar el script del Worker: ${WORKER_SCRIPT}.`;
             console.error(error);
        };
    }

    // --- Lógica de Búsqueda ---
    function searchData(searchTerm) {
        const term = searchTerm.trim();
        
        if (!isDataReady) {
            displayResult('Los datos aún se están procesando. Espera un momento.');
            return;
        }

        if (term.length === 0) {
            displayResult('Ingresa un número de Cédula o Ficha.', false);
            return;
        }

        const foundRow = allDataMap.get(term); 

        if (foundRow) {
            const clave = foundRow['clave'];
            if (clave) {
                displayResult(`Clave para ${term}: **${clave}**`);
            } else {
                displayResult(`ERROR: La columna 'clave' no se encontró o está vacía.`, true);
            }
        } else {
            displayResult(`No se encontró la Cédula o Ficha ${term}.`, true);
        }
    }

    // --- Evento de Carga de Archivo ---
    csvFile.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;

        loadStatus.textContent = `⏳ Leyendo el archivo...`;
        isDataReady = false;
        searchInput.disabled = true;
        
        const reader = new FileReader();
        reader.onload = (e) => {
            const csvContent = e.target.result;
            loadStatus.textContent = `🔄 Archivo leído. Procesando en segundo plano...`;
            
            // Enviar el contenido del CSV al Web Worker para el procesamiento
            worker.postMessage({ csvContent: csvContent });
        };
        reader.readAsText(file); // Leer el archivo como texto plano
    });

    // --- Evento de Búsqueda ---
    searchInput.addEventListener('input', (event) => {
        clearTimeout(window.searchTimeout);
        window.searchTimeout = setTimeout(() => {
            searchData(event.target.value);
        }, 300); 
    });
    
    // Inicializar el Web Worker al cargar la página
    initWorker();
    displayResult('Carga el archivo CSV para comenzar.');
</script>

</body>
</html>
