<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Asíncrono (Web Worker)</title>
    <style>
        /* Estilos Omitidos por brevedad */
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #e6f7ff; }
        .container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15); }
        input[type="text"] { display: block; width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        #results-box { margin-top: 20px; padding: 15px; border: 2px solid #007bff; border-radius: 8px; background-color: #e3f2ff; color: #004085; font-size: 1.2em; font-weight: bold; text-align: center; }
        .error-message { border-color: #dc3545 !important; background-color: #f8d7da !important; color: #721c24 !important; }
        #loadStatus { margin-bottom: 15px; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ Buscador de Carga Asíncrona</h1>
    <p id="loadStatus">Iniciando carga del archivo en segundo plano...</p>
    
    <hr>

    <h2>Buscar Usuario</h2>
    <input type="text" id="searchInput" placeholder="Esperando que finalice la carga de datos...">

    <h3>Clave Encontrada:</h3>
    <div id="results-box">
        La clave aparecerá aquí.
    </div>
</div>

<script>
    const CSV_FILE_PATH = 'Usuario_ARI.csv'; // La ruta sigue siendo la misma
    const WORKER_SCRIPT = 'csv_worker.js';

    const searchInput = document.getElementById('searchInput');
    const resultsBox = document.getElementById('results-box');
    const loadStatus = document.getElementById('loadStatus');

    let allDataMap = null; // El Map se almacenará aquí
    let isDataReady = false;

    function displayResult(message, isError = false) {
        resultsBox.textContent = message;
        resultsBox.className = 'results-box' + (isError ? ' error-message' : '');
    }

    // 1. Inicializar el Web Worker
    function initWorker() {
        if (window.Worker) {
            const worker = new Worker(WORKER_SCRIPT);
            
            // 1.1. Escuchar la respuesta del Worker
            worker.onmessage = function(event) {
                const data = event.data;
                
                if (data.status === 'success') {
                    // Recrear el Map a partir del Array transferido
                    allDataMap = new Map(data.dataMap);
                    isDataReady = true;

                    loadStatus.textContent = `✅ Carga completa. ${data.size / 2} registros listos.`;
                    loadStatus.style.color = '#28a745';
                    searchInput.disabled = false;
                    searchInput.placeholder = "¡Búsqueda ultrarrápida habilitada!";
                    displayResult('Ingresa un número de Cédula o Ficha.');
                } else {
                    // Manejar errores
                    loadStatus.textContent = `❌ ERROR en el Worker: ${data.message}`;
                    loadStatus.style.color = '#dc3545';
                    searchInput.disabled = true;
                    displayResult('Error al procesar los datos. Revisa la consola.', true);
                }
            };
            
            worker.onerror = function(error) {
                 loadStatus.textContent = `❌ ERROR Crítico del Worker: ${error.message}`;
            };

            // 1.2. Iniciar la tarea en el Worker
            worker.postMessage({ path: CSV_FILE_PATH });

        } else {
            // Fallback para navegadores antiguos (la lógica de carga es más lenta aquí)
            loadStatus.textContent = "❌ ERROR: Tu navegador no soporta Web Workers. Usando carga lenta...";
            // Aquí se llamaría a la función loadCSVFile() de la versión optimizada anterior.
            // Para simplificar, asumiremos que los navegadores modernos soportan Workers.
        }
    }

    // 2. Función de Búsqueda (Usa el Map cargado)
    function searchData(searchTerm) {
        const term = searchTerm.trim();
        
        if (!isDataReady) {
            displayResult('Los datos aún se están cargando en segundo plano. Espera un momento.', false);
            return;
        }

        if (term.length === 0) {
            displayResult('Ingresa un número de Cédula o Ficha.', false);
            return;
        }

        // Búsqueda O(1)
        const foundRow = allDataMap.get(term); 

        if (foundRow) {
            const clave = foundRow['clave'];
            if (clave) {
                displayResult(`Clave para ${term}: **${clave}**`);
            } else {
                displayResult(`ERROR: La columna 'clave' no se encontró o está vacía.`, true);
            }
        } else {
            displayResult(`No se encontró la Cédula o Ficha ${term}.`, true);
        }
    }

    // 3. Event Listener (con Debounce)
    searchInput.addEventListener('input', (event) => {
        clearTimeout(window.searchTimeout);
        window.searchTimeout = setTimeout(() => {
            searchData(event.target.value);
        }, 300); 
    });
    
    // Ejecutar la carga al iniciar la página
    searchInput.disabled = true; 
    displayResult('Los datos se están procesando...');
    initWorker();

</script>

</body>
</html>
