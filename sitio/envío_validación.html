<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Acceso con Clave por Correo</title>
    <style>
        /* Estilos CSS para la interfaz */
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="email"], input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #verification-form {
            display: none;
        }
        .message {
            margin-top: 15px;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            display: none;
        }
        .success { 
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error { 
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 id="form-title">Paso 1: Solicitar Clave por Correo</h2>

    <form id="request-form">
        <label for="email">Correo Electrónico:</label>
        <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Ej: tu_correo@gmail.com" 
            required
        >
        <button type="submit">Enviar Clave de Acceso</button>
    </form>

    <form id="verification-form">
        <label for="otp">Clave de Acceso (OTP):</label>
        <input 
            type="text" 
            id="otp" 
            name="otp" 
            placeholder="Ingrese el código de 6 dígitos" 
            required 
            maxlength="6"
            pattern="[0-9]{6}"
            title="Solo se permiten 6 dígitos."
        >
        <button type="submit">Verificar Código</button>
    </form>
    
    <div id="status-message" class="message"></div>
</div>

<script>
    // Se definen los elementos del DOM
    const requestForm = document.getElementById('request-form');
    const verificationForm = document.getElementById('verification-form');
    const formTitle = document.getElementById('form-title');
    const statusMessage = document.getElementById('status-message');

    // Función auxiliar para mostrar mensajes de estado
    function showStatusMessage(message, type) {
        statusMessage.textContent = message;
        statusMessage.className = 'message ' + type;
        statusMessage.style.display = 'block';
    }

    // --- MANEJA LA SOLICITUD DEL CÓDIGO (Llama al servidor /api/send-otp) ---
    requestForm.addEventListener('submit', function(event) {
        event.preventDefault(); 
        const userIdentifier = document.getElementById('email').value; 
        
        showStatusMessage('Enviando clave de acceso al correo electrónico...', 'success');
        
        // El navegador intenta enviar la solicitud al servidor (Backend) que debe estar corriendo.
        fetch('/api/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: userIdentifier }) 
        })
        .then(response => {
            // Verifica si la respuesta HTTP es 200 (OK) o 500 (Error del servidor)
            if (response.ok) {
                return response.json();
            } else {
                // Si la conexión falló o el servidor devolvió un error (e.g., 404, 500)
                throw new Error('Error HTTP: ' + response.status + ' - ' + response.statusText);
            }
        })
        .then(data => {
            if (data.success) {
                showStatusMessage('Código enviado. Revisa tu bandeja de entrada.', 'success');
                // Ocultar el primer formulario y mostrar el segundo
                requestForm.style.display = 'none';
                verificationForm.style.display = 'block';
                formTitle.textContent = 'Paso 2: Ingresar Clave (OTP)';
            } else {
                showStatusMessage('? Error al enviar: ' + (data.message || 'Verifica el correo electrónico.'), 'error');
            }
        })
        .catch(error => {
            console.error('Fetch error:', error);
            // Este es el error que te aparece si el 'server.js' no está corriendo
            showStatusMessage('? Error de conexión con el servidor. ¿Está el backend activo en el puerto 3000?', 'error'); 
        });
    });

    // --- MANEJA LA VERIFICACIÓN DEL CÓDIGO (Llama al servidor /api/verify-otp) ---
    verificationForm.addEventListener('submit', function(event) {
        event.preventDefault(); 
        const userIdentifier = document.getElementById('email').value;
        const otpCode = document.getElementById('otp').value;
        
        showStatusMessage('Verificando código...', 'success');

        // El navegador intenta enviar la solicitud al servidor (Backend) para validar el código
        fetch('/api/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: userIdentifier, otp: otpCode })
        })
        .then(response => {
            if (response.ok) {
                return response.json();
            } else {
                throw new Error('Error HTTP: ' + response.status + ' - ' + response.statusText);
            }
        })
        .then(data => {
            if (data.success) {
                showStatusMessage('? ¡Acceso verificado! Ingreso exitoso.', 'success');
            } else {
                showStatusMessage('? ' + data.message, 'error');
            }
        })
        .catch(error => {
            console.error('Fetch error:', error);
            showStatusMessage('? Error de conexión con el servidor.', 'error');
        });
    });
</script>

</body>
</html>
